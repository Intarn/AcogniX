<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Detail - AcogniX</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">
  <div class="flex h-full w-full">
    <!-- Sidebar (copy from another admin page) -->
    <aside class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <div>
        <!-- Logo -->
        <div class="p-6 flex items-center gap-2.5">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>
              <linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient>
              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>
            </defs>
            <path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
        </div>
        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1.5">
          <a href="./admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
          </a>
          <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            User Management
          </a>
          <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            Course Management
          </a>
          <a href="./admin-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Analytics
          </a>
          <a href="./admin-settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            System Settings
          </a>
        </nav>
      </div>
    </aside>
    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      <!-- TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <div>
          <a href="./admin-course-management.html" class="text-sm font-medium text-gray-500 hover:text-gray-800">Course Management</a>
          <span class="text-sm font-medium text-gray-400 mx-2">/</span>
          <h1 id="course-name-header" class="inline-block text-lg font-bold text-gray-800">Course Detail</h1>
        </div>
        <a href="./admin-course-management.html" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">Back to List</a>
      </header>
      <!-- COURSE DETAIL FORM -->
      <main class="p-6">
        <div id="course-detail-container" class="w-full max-w-4xl mx-auto bg-white p-8 rounded-xl border border-gray-100 shadow-sm space-y-6">
          <!-- Loading state -->
          <p id="loading-message">Loading course details...</p>
          <!-- Content will be populated by JS -->
        </div>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const COURSES_KEY = 'acognix_courses';
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('id'));

        const container = document.getElementById('course-detail-container');
        const loadingMessage = document.getElementById('loading-message');
        const courseNameHeader = document.getElementById('course-name-header');

        if (!courseId) {
            container.innerHTML = '<p class="text-red-500 font-bold">Error: No course ID provided.</p>';
            return;
        }

        const allCourses = JSON.parse(localStorage.getItem(COURSES_KEY)) || [];
        const course = allCourses.find(c => c.id === courseId);

        if (!course) {
            container.innerHTML = `<p class="text-red-500 font-bold">Error: Course with ID ${courseId} not found.</p>`;
            return;
        }

        loadingMessage.style.display = 'none';
        courseNameHeader.textContent = course.name;

        const statusClass = course.status === 'Published' 
            ? 'bg-green-100 text-green-700' 
            : 'bg-gray-100 text-gray-700';

        container.innerHTML = `
            <div>
                <h2 class="text-2xl font-bold text-gray-800">${course.name}</h2>
                <p class="text-sm text-gray-500 mt-1">Taught by <span class="font-semibold">${course.teacher}</span></p>
            </div>
            <div class="grid grid-cols-3 gap-6 pt-4 border-t border-gray-100">
                <div>
                    <p class="text-xs font-medium text-gray-500">STATUS</p>
                    <p class="text-sm font-semibold mt-1"><span class="${statusClass} px-2 py-0.5 rounded-full">${course.status}</span></p>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500">STUDENTS ENROLLED</p>
                    <p class="text-sm font-semibold mt-1">${course.enrolled.toLocaleString()}</p>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500">COURSE ID</p>
                    <p class="text-sm font-semibold mt-1 font-mono">${course.id}</p>
                </div>
            </div>
            <div>
                <h3 class="text-base font-bold text-gray-800 mb-2 mt-4 border-t border-gray-100 pt-4">Description</h3>
                <p class="text-sm text-gray-600 leading-relaxed">
                    This is a placeholder description for the course "${course.name}". A real implementation would store and display a full course description, syllabus, and learning objectives here. This course is designed to provide a comprehensive overview of its subject matter, suitable for beginners and intermediate learners.
                </p>
            </div>
        `;
    });
  </script>
</body>
</html>
