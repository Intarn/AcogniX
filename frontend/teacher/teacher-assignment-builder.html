<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Builder - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR (Teacher Version) -->
    <aside class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <div>
        <!-- Logo -->
        <div class="p-6 flex items-center gap-2.5">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>
              <linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient>
              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>
            </defs>
            <path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
        </div>

        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1.5">
          <a href="./teacher-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
          </a>
          <a href="./teacher-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            My Courses
          </a>
          <a href="./teacher-assignments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            Assignments
          </a>
          <a href="./teacher-students.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Students
          </a>
          <a href="./teacher-student-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Analytics
          </a>
          <a href="./teacher-gradebook.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H4a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            Gradebook
          </a>
          <a href="../shared/community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
            Messages
          </a>
        </nav>
      </div>
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="" class="w-9 h-9 rounded-full object-cover bg-gray-200">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight"></p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400"></p>
          </div>
          <a href="../auth/settings.html" class="ml-auto">
            <span class="text-gray-400 text-[10px]">⚙️</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">Assignment Builder</h1>
        <div class="flex items-center gap-3">
          <button id="save-draft-btn" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">Save as Draft</button>
          <button id="publish-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
            Publish Assignment
          </button>
        </div>
      </header>

      <!-- 3. ASSIGNMENT BUILDER CONTENT -->
      <main class="flex-1 grid grid-cols-12 overflow-hidden">

        <!-- 3.1. Main Editor -->
        <div class="col-span-8 h-full overflow-y-auto p-6 space-y-5">
          <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
            <label for="assignment-title" class="text-sm font-bold text-gray-800">Assignment Title</label>
            <input type="text" id="title" placeholder="e.g., Problem Set 3: Kinematics" class="w-full mt-2 text-lg font-semibold text-gray-700 border border-gray-200 rounded-lg outline-none focus:ring-1 focus:ring-blue-300 p-2">
          </div>

          <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
            <div class="p-4 border-b border-gray-100">
              <h3 class="text-sm font-bold text-gray-800">Instructions</h3>
            </div>
            <!-- Rich Text Editor (simulated) -->
            <div id="instructions" class="p-4 min-h-[200px] text-sm text-gray-600 outline-none" contenteditable="true">
              <p>Please solve the following problems from the textbook, Chapter 3...</p>
            </div>
            <div class="p-2 border-t border-gray-100 bg-gray-50/50 rounded-b-xl">
              <button class="text-xs font-semibold text-blue-600 hover:underline p-2">Attach File</button>
            </div>
          </div>
        </div>

        <!-- 3.2. Settings Sidebar -->
        <div class="col-span-4 h-full bg-white border-l border-gray-100 overflow-y-auto p-6 space-y-5">
          <h2 class="text-base font-bold text-gray-800">Settings</h2>
          
          <div>
            <label for="course-select" class="text-sm font-semibold text-gray-700">Course</label>
            <select id="course-select" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
              <!-- Options will be populated by JS -->
            </select>
          </div>

          <div>
            <label for="points" class="text-sm font-semibold text-gray-700">Points</label>
            <input type="number" id="points" value="100" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
          </div>

          <div>
            <label for="due-date" class="text-sm font-semibold text-gray-700">Due Date</label>
            <input type="datetime-local" id="due-date" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
          </div>

          <div>
            <label for="submission-type" class="text-sm font-semibold text-gray-700">Submission Type</label>
            <select id="submission-type" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
              <option>File Upload</option>
              <option>Text Entry</option>
              <option>On Paper</option>
            </select>
          </div>

          <div>
            <label class="text-sm font-semibold text-gray-700">Assign To</label>
            <div class="mt-2 space-y-2">
              <label class="flex items-center gap-2"><input type="radio" name="assign-to" checked class="text-blue-600 focus:ring-blue-300"><span class="text-sm">Everyone</span></label>
              <label class="flex items-center gap-2"><input type="radio" name="assign-to" class="text-blue-600 focus:ring-blue-300"><span class="text-sm">Specific Students</span></label>
            </div>
          </div>

        </div>

      </main>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'teacher') {
            // window.location.href = './login.html';
            return;
        }

        // Update user info in sidebar
        document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
        document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
        document.getElementById('user-avatar-sidebar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;


        // DOM Elements
        const titleInput = document.getElementById('title');
        const courseSelect = document.getElementById('course-select');
        const dueDateInput = document.getElementById('due-date');
        const publishBtn = document.getElementById('publish-btn');

        // 1. Populate teacher's courses in the dropdown
        const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
        const myCourses = allCourses.filter(course => course.teacher === currentUser.fullname);

        courseSelect.innerHTML = ''; // Clear existing options
        if (myCourses.length > 0) {
            myCourses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.id;
                option.textContent = course.name;
                courseSelect.appendChild(option);
            });
        } else {
            courseSelect.innerHTML = '<option disabled>No courses found. Please create a course first.</option>';
            publishBtn.disabled = true;
            publishBtn.classList.add('cursor-not-allowed', 'bg-blue-400');
        }

        // 2. Handle form submission
        publishBtn.addEventListener('click', function() {
            const title = titleInput.value.trim();
            const courseId = parseInt(courseSelect.value);
            const dueDate = dueDateInput.value;

            if (!title || !courseId || !dueDate) {
                alert('Please fill out all fields: Title, Course, and Due Date.');
                return;
            }

            const allAssignments = JSON.parse(localStorage.getItem('acognix_assignments')) || [];
            const newAssignmentId = allAssignments.length > 0 ? Math.max(...allAssignments.map(a => a.id)) + 1 : 1;

            const newAssignment = {
                id: newAssignmentId,
                title: title,
                courseId: courseId,
                dueDate: dueDate,
                // instructions: document.getElementById('instructions').innerHTML // Optional: save instructions
            };

            allAssignments.push(newAssignment);
            localStorage.setItem('acognix_assignments', JSON.stringify(allAssignments));

            alert('Assignment published successfully!');
            window.location.href = './teacher-assignments.html';
        });
    });
  </script>

</body>
</html>
