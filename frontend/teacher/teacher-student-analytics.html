        <!-- Navigation -->

            Dashboard
          </a>
          <a href="./teacher-my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            My Courses

          <a href="./teacher-assignments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            Assignments
          </a>
          <a href="./teacher-students.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Students
          </a>
          <a href="./teacher-student-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Analytics
          </a>
          <a href="./teacher-gradebook.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H4a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            Gradebook
          </a>
          <a href="../shared/community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Community
          </a>

      </div>
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="" class="w-9 h-9 rounded-full object-cover bg-gray-200">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight"></p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400"></p>
          </div>
          <a href="../auth/settings.html" class="ml-auto">
            <span class="text-gray-400 text-[10px]">⚙️</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <div class="flex items-center gap-4">
          <h1 class="text-lg font-bold text-gray-800">Student Analytics</h1>
          <select id="course-select" class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white outline-none focus:ring-1 focus:ring-blue-300">
            <option value="all">All Courses</option>
          </select>
        </div>
        <button id="export-btn" class="text-xs font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100">
          Export Report
        </button>
      </header>

      <!-- 3. ANALYTICS CONTENT -->
      <main class="p-6 space-y-6">
        <!-- Key Metrics -->
        <div class="grid grid-cols-4 gap-6">
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <p class="text-sm font-medium text-gray-500">Total Students</p>
            <p id="total-students" class="text-4xl font-bold text-gray-800 mt-1">0</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <p class="text-sm font-medium text-gray-500">Avg. Completion Rate</p>
            <p id="avg-completion" class="text-4xl font-bold text-gray-800 mt-1">0%</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <p class="text-sm font-medium text-gray-500">Avg. Quiz Score</p>
            <p id="avg-score" class="text-4xl font-bold text-gray-800 mt-1">0%</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <p class="text-sm font-medium text-gray-500">Most Difficult Topic</p>
            <p id="difficult-topic" class="text-lg font-bold text-gray-800 mt-2 truncate">Calculating...</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
          <!-- Performance Distribution Chart -->
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <h3 class="text-base font-bold text-gray-800 mb-4">Overall Performance Distribution</h3>
            <div class="h-64">
              <canvas id="performanceChart"></canvas>
            </div>
          </div>
          
          <!-- At-Risk Students -->
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <h3 class="text-base font-bold text-gray-800 mb-4">Students to Watch</h3>
            <table class="w-full text-sm text-left">
              <thead class="text-xs text-gray-500 uppercase bg-gray-50/50">
                <tr>
                  <th class="px-4 py-2">Student</th>
                  <th class="px-4 py-2">Avg. Score</th>
                  <th class="px-4 py-2">Last Active</th>
                  <th class="px-4 py-2"></th>
                </tr>
              </thead>
              <tbody id="students-watch-table">
                <!-- Data will be populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- SCRIPT KHỞI TẠO BIỂU ĐỒ CHART.JS -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!currentUser || currentUser.role !== 'teacher') {
        // window.location.href = './login.html';
        return;
      }

      // Update user info in sidebar
      document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
      document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
      document.getElementById('user-avatar-sidebar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;

      document.getElementById('export-btn').addEventListener('click', () => alert('Chức năng Export Report đang được phát triển!'));

      const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
      const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];

      const courseSelect = document.getElementById('course-select');
      const totalStudentsEl = document.getElementById('total-students');
      const avgCompletionEl = document.getElementById('avg-completion');
      const avgScoreEl = document.getElementById('avg-score');
      const difficultTopicEl = document.getElementById('difficult-topic');
      const studentsWatchTable = document.getElementById('students-watch-table');
      const performanceChartCtx = document.getElementById('performanceChart').getContext('2d');
      let performanceChart;

      // Populate course dropdown
      const myCourses = allCourses.filter(c => c.teacher === currentUser.fullname);
      myCourses.forEach(course => {
        courseSelect.innerHTML += `<option value="${course.id}">${course.name}</option>`;
      });

      function updateAnalytics(selectedCourseId) {
        let targetCourseIds = [];
        if (selectedCourseId === 'all') {
            targetCourseIds = myCourses.map(c => c.id);
        } else {
            targetCourseIds = [parseInt(selectedCourseId)];
        }

        const myStudents = allUsers.filter(user =>
            user.role === 'student' && user.enrolledCourses &&
            user.enrolledCourses.some(id => targetCourseIds.includes(id))
        );

        // Generate mock data for each student
        const studentData = myStudents.map(student => ({
            ...student,
            mockScore: Math.floor(Math.random() * 60) + 40, // Score between 40 and 100
            mockLastActive: Math.floor(Math.random() * 10) + 1 // 1 to 10 days ago
        }));

        // Update Key Metrics (with mock data)
        totalStudentsEl.textContent = studentData.length;
        const avgScore = studentData.length > 0 ? studentData.reduce((acc, s) => acc + s.mockScore, 0) / studentData.length : 0;
        avgScoreEl.textContent = `${Math.round(avgScore)}%`;
        avgCompletionEl.textContent = `${Math.max(0, Math.round(avgScore - 15))}%`; // Mock completion, ensure it's not negative
        difficultTopicEl.textContent = myCourses.length > 0 ? (myCourses[Math.floor(Math.random() * myCourses.length)].name.split(' ').slice(0,2).join(' ') + '...') : 'N/A';

        // Update "Students to Watch" table
        const atRiskStudents = studentData.filter(s => s.mockScore < 70).sort((a, b) => a.mockScore - b.mockScore).slice(0, 3);
        studentsWatchTable.innerHTML = '';
        if (atRiskStudents.length > 0) {
            atRiskStudents.forEach(s => {
                const scoreColor = s.mockScore < 60 ? 'text-red-600' : 'text-orange-600';
                studentsWatchTable.innerHTML += `
                    <tr class="border-b border-gray-100">
                      <td class="px-4 py-3 font-bold flex items-center gap-2"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(s.fullname)}&color=fff" class="w-6 h-6 rounded-full object-cover"> ${s.fullname}</td>
                      <td class="px-4 py-3 font-semibold ${scoreColor}">${s.mockScore}%</td>
                      <td class="px-4 py-3">${s.mockLastActive} days ago</td>
                      <td class="px-4 py-3"><a href="#" class="text-xs font-bold text-blue-600 hover:underline">View</a></td>
                    </tr>`;
            });
        } else {
            studentsWatchTable.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">No students are currently at risk.</td></tr>`;
        }

        // Update Performance Chart
        const performanceGroups = {
            excellent: studentData.filter(s => s.mockScore > 85).length,
            good: studentData.filter(s => s.mockScore > 75 && s.mockScore <= 85).length,
            average: studentData.filter(s => s.mockScore > 60 && s.mockScore <= 75).length,
            atRisk: studentData.filter(s => s.mockScore <= 60).length,
        };

        if (performanceChart) {
            performanceChart.destroy();
        }
        performanceChart = new Chart(performanceChartCtx, {
        type: 'doughnut',
        data: {
          labels: ['Requires attention (<60%)', 'Average (60-75%)', 'Good (75-85%)', 'Excellent (>85%)'],
          datasets: [{
            data: [performanceGroups.atRisk, performanceGroups.average, performanceGroups.good, performanceGroups.excellent],
            backgroundColor: [
              '#EF4444', // Red - Cần lưu ý
              '#F59E0B', // Amber - Trung bình
              '#3B82F6', // Blue - Khá
              '#10B981'  // Emerald - Xuất sắc
            ],
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 12,
                padding: 15,
                font: {
                  size: 12,
                  family: 'sans-serif'
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const value = context.raw;
                  const percentage = ((value / total) * 100).toFixed(1);
                  return ` ${context.label}: ${value} học sinh (${percentage}%)`;
                }
              }
            }
          },
          cutout: '70%'
        }
      });
      }

      // Initial load and event listener
      updateAnalytics(courseSelect.value);
      courseSelect.addEventListener('change', (e) => {
        updateAnalytics(e.target.value);
      });
    });
  </script>
</body>
</html>
