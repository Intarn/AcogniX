        <a href="./teacher-assignment-builder.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
          + Create New Assignment
        </a>
      </header>
      <main class="p-6 space-y-6">
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
          <h3 class="text-base font-bold text-gray-800 mb-4">Published Assignments</h3>
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-500 uppercase bg-gray-50/50">
              <tr>
                <th class="px-4 py-2">Title</th>
                <th class="px-4 py-2">Course</th>
                <th class="px-4 py-2">Due Date</th>
                <th class="px-4 py-2">Submissions</th>
                <th class="px-4 py-2">Actions</th>
              </tr>
            </thead>
            <tbody id="assignments-table" class="divide-y divide-gray-100">
              <!-- Dữ liệu sẽ được chèn vào đây -->
            </tbody>
          </table>
        </div>
      </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        };

        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) {
            // window.location.href = './login.html';
            return;
        }

        // Update user info in sidebar
        document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
        document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
        document.getElementById('user-avatar-sidebar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;


        const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
        const allAssignments = JSON.parse(localStorage.getItem('acognix_assignments')) || [];
        const allSubmissions = JSON.parse(localStorage.getItem('acognix_submissions')) || [];
        const tableBody = document.getElementById('assignments-table');

        // Lấy ID các khóa học của giáo viên này
        const myCourseIds = allCourses
            .filter(course => course.teacher === currentUser.fullname)
            .map(course => course.id);

        // Lọc ra các bài tập thuộc khóa học của giáo viên
        const myAssignments = allAssignments.filter(assignment => myCourseIds.includes(assignment.courseId));

        tableBody.innerHTML = '';
        if (myAssignments.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" class="px-4 py-3 text-center text-gray-500">No assignments created yet.</td></tr>';
        } else {
            myAssignments.forEach(assignment => {
                const course = allCourses.find(c => c.id === assignment.courseId);
                if (!course) return;
                
                // Lấy số lượng sinh viên đã đăng ký khóa học này
                const enrolledStudents = (JSON.parse(localStorage.getItem('acognix_users')) || []).filter(u => u.role === 'student' && u.enrolledCourses && u.enrolledCourses.includes(course.id));
                const totalStudents = enrolledStudents.length;
                
                // Đếm số bài nộp thật từ acognix_submissions
                const submissions = allSubmissions.filter(s => s.assignmentId === assignment.id).length;

                const dueDate = new Date(assignment.dueDate);
                const formattedDate = dueDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

                const row = `
                    <tr class="border-b border-gray-100 hover:bg-gray-50/50">
                        <td class="px-4 py-3 font-bold">${escapeHTML(assignment.title)}</td>
                        <td class="px-4 py-3">${escapeHTML(course.name)}</td>
                        <td class="px-4 py-3">${formattedDate}</td>
                        <td class="px-4 py-3">${submissions} / ${totalStudents}</td>
                        <td class="px-4 py-3 flex gap-2">
                            <button onclick="toggleSubmissions(${assignment.id})" class="text-xs font-bold text-blue-600 hover:underline">Grade Submissions</button>
                            <a href="./teacher-assignment-builder.html?id=${assignment.id}" class="text-xs font-bold text-gray-500 hover:underline">Edit</a>
                        </td>
                    </tr>
                    <tr id="submissions-for-${assignment.id}" class="hidden">
                        <td colspan="5" class="p-4 bg-gray-100/60">
                            <div id="submissions-content-for-${assignment.id}"></div>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        window.toggleSubmissions = function(assignmentId) {
            const submissionRow = document.getElementById(`submissions-for-${assignmentId}`);
            const submissionContent = document.getElementById(`submissions-content-for-${assignmentId}`);

            if (!submissionRow.classList.contains('hidden')) {
                submissionRow.classList.add('hidden');
                return;
            }

            // --- If content is not loaded yet, load it ---
            if (submissionContent.innerHTML === '') {
                const allSubmissions = JSON.parse(localStorage.getItem('acognix_submissions')) || [];
                const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];
                const submissions = allSubmissions.filter(s => s.assignmentId === assignmentId);

                if (submissions.length === 0) {
                    submissionContent.innerHTML = `<div class="text-center p-4 text-gray-500">No submissions for this assignment yet.</div>`;
                } else {
                    let tableHtml = `
                        <div class="bg-white rounded-lg border border-gray-200 shadow-inner">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-100">
                                    <tr>
                                        <th class="px-4 py-2">Student</th>
                                        <th class="px-4 py-2">Submitted On</th>
                                        <th class="px-4 py-2">Submission</th>
                                        <th class="px-4 py-2 w-32">Grade (/100)</th>
                                        <th class="px-4 py-2">Feedback</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200">`;
                    
                    submissions.forEach(sub => {
                        const student = allUsers.find(u => u.email === sub.studentEmail);
                        if (!student) return;

                        let submissionLink = '';
                        if (sub.submissionType === 'link' && sub.submissionContent) {
                            submissionLink = `<a href="${escapeHTML(sub.submissionContent)}" target="_blank" class="text-blue-600 hover:underline font-semibold">View Link</a>`;
                        } else {
                            submissionLink = `<span class="font-semibold">${escapeHTML(sub.submissionContent)}</span>`;
                        }

                        tableHtml += `
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2 font-semibold text-gray-800">${escapeHTML(student.fullname)}</td>
                                <td class="px-4 py-2 text-gray-500">${new Date(sub.submittedAt).toLocaleDateString()}</td>
                                <td class="px-4 py-2">${submissionLink}</td>
                                <td class="px-4 py-2">
                                    <input type="number" data-submission-id="${sub.id}" value="${sub.grade || ''}" class="grade-input w-20 text-center bg-gray-100 rounded-md outline-none focus:ring-1 focus:ring-blue-400 p-1" placeholder="N/A">
                                </td>
                                <td class="px-4 py-2">
                                    <input type="text" data-submission-id="${sub.id}" value="${escapeHTML(sub.feedback || '')}" class="feedback-input w-full bg-gray-100 rounded-md outline-none focus:ring-1 focus:ring-blue-400 p-1" placeholder="Add feedback...">
                                </td>
                            </tr>
                        `;
                    });

                    tableHtml += `</tbody></table></div>`;
                    submissionContent.innerHTML = tableHtml;

                    // Add event listeners for the new inputs
                    submissionContent.querySelectorAll('.grade-input, .feedback-input').forEach(input => {
                        input.addEventListener('change', (e) => {
                            const submissionId = parseInt(e.target.dataset.submissionId);
                            const allSubmissions = JSON.parse(localStorage.getItem('acognix_submissions')) || [];
                            const subIndex = allSubmissions.findIndex(s => s.id === submissionId);

                            if (subIndex > -1) {
                                if (e.target.classList.contains('grade-input')) {
                                    allSubmissions[subIndex].grade = e.target.value ? parseInt(e.target.value) : null;
                                }
                                if (e.target.classList.contains('feedback-input')) {
                                    allSubmissions[subIndex].feedback = e.target.value;
                                }
                                localStorage.setItem('acognix_submissions', JSON.stringify(allSubmissions));
                                
                                e.target.classList.add('bg-green-100', 'border-green-400');
                                setTimeout(() => e.target.classList.remove('bg-green-100', 'border-green-400'), 2000);
                            }
                        });
                    });
                }
            }

            // --- Show the row ---
            submissionRow.classList.remove('hidden');
        };
    });
  </script>
