<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Decks - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 flex-shrink-0">
        <div class="relative w-[480px]">
          <svg class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-decks-input" placeholder="Search for decks..." class="w-full bg-gray-50/80 text-xs rounded-full pl-10 pr-4 py-2 border border-gray-100 outline-none focus:bg-white focus:border-blue-300">
        </div>
        <div class="flex items-center gap-5">
          <div class="flex items-center gap-3 cursor-pointer">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
              <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
              <p id="user-role-topbar" class="text-[10px] text-gray-400">Student</p>
            </div>
          </div>
        </div>
      </header>

      <!-- 3. DECK MANAGEMENT CONTENT -->
      <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-2xl font-bold text-gray-800">My Flashcard Decks</h1>
          <button id="create-deck-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
            + Create New Deck
          </button>
        </div>

        <!-- Deck Grid -->
        <div id="decks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Deck cards will be dynamically inserted here -->
        </div>
      </main>

    </div>
  </div>

  <!-- Modals for Edit and Create -->
  <div id="deck-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 id="modal-title" class="text-lg font-bold text-gray-800">Create New Deck</h3>
        <button id="close-modal-btn" class="text-gray-400 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="deck-form" class="p-6 space-y-4">
        <div>
          <label for="deck-name-input" class="text-sm font-semibold text-gray-700">Deck Name</label>
          <input type="text" id="deck-name-input" placeholder="e.g., Physics Chapter 1" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200" required>
          <input type="hidden" id="original-deck-name">
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="cancel-modal-btn" class="text-xs font-semibold text-gray-500 bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200">Cancel</button>
          <button type="submit" id="save-deck-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2 rounded-lg shadow-sm">Save Deck</button>
        </div>
      </form>
    </div>
  </div>

    const escapeHTML = (str) => {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    };

                    <a href="./admin-settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>System Settings</a>

            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img id="user-avatar-sidebar" src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight">${safeFullname}</p>
                        <p id="user-role-sidebar" class="text-[10px] text-gray-400">${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)}</p>
                    </div>
                    <a href="../auth/settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>
                </div>
            </div>
        `;
        const sidebarContainer = document.getElementById('sidebar-container');
        const role = currentUser.role;

        if (role === 'teacher') {
            sidebarContainer.innerHTML = teacherSidebarTemplate;
        } else if (role === 'admin') {
            sidebarContainer.innerHTML = adminSidebarTemplate;
        } else {
            sidebarContainer.innerHTML = studentSidebarTemplate;
        }

        // --- Main Logic ---
        function renderDecks() {
            const allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
            const userFlashcards = allFlashcards.filter(fc => fc.userId === currentUser.email);
            
            const decks = userFlashcards.reduce((acc, card) => {
                if (!acc[card.deck]) {
                    acc[card.deck] = { name: card.deck, cards: [] };
                }
                acc[card.deck].cards.push(card);
                return acc;
            }, {});

            const searchTerm = searchInput.value.toLowerCase();
            const filteredDecks = Object.values(decks).filter(deck => deck.name.toLowerCase().includes(searchTerm));

            decksGrid.innerHTML = '';
            if (filteredDecks.length === 0) {
                decksGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">No decks found. Create one to get started!</p>`;
                return;
            }

            filteredDecks.forEach(deck => {
                const newCount = deck.cards.filter(c => c.status === 'new').length;
                const learningCount = deck.cards.filter(c => c.status === 'learning').length;
                const reviewingCount = deck.cards.filter(c => c.status === 'reviewing').length;

                // CLEAN CODE & BẢO MẬT: Bọc tên deck qua hàm escapeHTML
                const safeDeckName = escapeHTML(deck.name);

                const cardHtml = `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col p-5 space-y-4">
                        <h3 class="text-base font-bold text-gray-800 truncate" title="${safeDeckName}">${safeDeckName}</h3>
                        <div class="text-sm font-semibold text-gray-500">${deck.cards.length} cards</div>
                        
                        <div class="flex-1 space-y-1 text-xs">
                            <div class="flex justify-between items-center"><span class="text-blue-600">New</span><span class="font-bold">${newCount}</span></div>
                            <div class="flex justify-between items-center"><span class="text-orange-600">Learning</span><span class="font-bold">${learningCount}</span></div>
                            <div class="flex justify-between items-center"><span class="text-green-600">Reviewing</span><span class="font-bold">${reviewingCount}</span></div>
                        </div>

                        <div class="pt-4 border-t border-gray-100 flex gap-2">
                            <button onclick="studyDeck('${safeDeckName}')" class="flex-1 text-center bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded-lg transition-colors">Study</button>
                            <button onclick="editDeck('${safeDeckName}')" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600">✏️</button>
                            <button onclick="deleteDeck('${safeDeckName}')" class="p-2 bg-red-50 hover:bg-red-100 rounded-lg text-red-600">🗑️</button>
                        </div>
                    </div>
                `;
                decksGrid.innerHTML += cardHtml;
            });
        }

        // --- Modal & Actions ---
        window.studyDeck = function(deckName) {
            window.location.href = `./flashcards.html?deck=${encodeURIComponent(deckName)}`;
        }

        window.editDeck = function(deckName) {
            modalTitle.textContent = 'Edit Deck Name';
            deckNameInput.value = deckName;
            originalDeckNameInput.value = deckName;
            modal.classList.remove('hidden');
        }

        window.deleteDeck = function(deckName) {
            if (confirm(`Are you sure you want to delete the entire deck "${deckName}"? This will delete all cards within it and cannot be undone.`)) {
                let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
                const remainingFlashcards = allFlashcards.filter(fc => !(fc.userId === currentUser.email && fc.deck === deckName));
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(remainingFlashcards));
                renderDecks();
            }
        }

        document.getElementById('create-deck-btn').addEventListener('click', () => {
            modalTitle.textContent = 'Create New Deck';
            deckForm.reset();
            originalDeckNameInput.value = '';
            modal.classList.remove('hidden');
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

        deckForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newDeckName = deckNameInput.value.trim();
            const originalDeckName = originalDeckNameInput.value;

            if (!newDeckName) {
                alert('Deck name cannot be empty.');
                return;
            }

            let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];

            if (originalDeckName) { // Editing existing deck
                allFlashcards.forEach(card => {
                    if (card.userId === currentUser.email && card.deck === originalDeckName) {
                        card.deck = newDeckName;
                    }
                });
                alert('Deck renamed successfully!');
            } else { // Creating a new deck
                alert('Deck created! You will now be taken to the study page to add your first card.');
                window.location.href = `./flashcards.html?deck=${encodeURIComponent(newDeckName)}`;
                return;
            }
            
            localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(allFlashcards));
            modal.classList.add('hidden');
            renderDecks();
        });

        // --- Initial Load & Listeners ---
        searchInput.addEventListener('input', renderDecks);
        renderDecks();
    });
  </script>

  <script src="../shared/auth-guard.js"></script>
