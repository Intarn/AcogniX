<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <!-- Sidebar content will be injected here -->
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">Flashcards</h1>
        <div class="flex items-center gap-5">
          <button class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">End Session</button>
          <div id="user-profile-topbar" class="flex items-center gap-3 cursor-pointer">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
              <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
              <p id="user-role-topbar" class="text-[10px] text-gray-400">Student</p>
            </div>
          </div>
        </div>
      </header>

      <!-- 3. FLASHCARDS CONTENT -->
      <main class="flex-1 flex items-center justify-center p-6 bg-gray-100/30">
        <div class="w-full max-w-4xl mx-auto">
          
          <!-- Deck Title & Progress -->
          <div class="mb-4 text-center relative">
            <div class="flex items-center justify-center gap-2 group">
              <h2 id="deck-title" class="text-xl font-bold text-gray-800">Loading Deck...</h2>
              <select id="deck-selector" class="text-sm font-semibold border-none rounded-lg outline-none focus:ring-0 bg-transparent appearance-none cursor-pointer group-hover:bg-gray-100 p-1">
                <!-- Deck options will be populated here -->
              </select>
            </div>

            <p id="card-progress" class="text-sm text-gray-500">Card 0 of 0</p>
            <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden mt-3 max-w-md mx-auto">
              <div id="progress-bar" class="bg-blue-500 h-full" style="width: 0%"></div>
            </div>
          </div>
          
          <div class="grid grid-cols-12 gap-6 items-start">
            
            <!-- Main Flashcard -->
            <div class="col-span-9">
              <div class="relative">
                <!-- Flashcard -->
                <div class="aspect-[3/2] w-full bg-white rounded-2xl shadow-lg border border-gray-100 p-8 flex flex-col justify-center items-center text-center">
                  <p id="flashcard-front" class="text-2xl font-semibold text-gray-800">Loading...</p>
                  <button id="show-answer-btn" class="mt-6 text-sm font-bold text-blue-600">Show Answer</button>
                </div>
                
                <!-- Answer Overlay (hidden by default) -->
                <div id="flashcard-back-overlay" class="absolute inset-0 aspect-[3/2] w-full bg-white rounded-2xl shadow-lg border border-gray-100 p-8 flex flex-col justify-center items-center text-center opacity-0 pointer-events-none">
                  <p id="flashcard-back" class="text-lg text-gray-700 leading-relaxed">Loading...</p>
                </div>
              </div>

              <!-- Confidence Buttons: Added data-action for Clean Code and logic separation -->
              <div id="confidence-buttons" class="mt-6 grid grid-cols-4 gap-4 hidden">
                <button data-action="again" class="py-3 bg-white border-2 border-red-200 text-red-600 rounded-lg text-sm font-bold hover:bg-red-50">Again <span class="font-normal text-xs block">&lt;1m</span></button>
                <button data-action="hard" class="py-3 bg-white border-2 border-orange-200 text-orange-600 rounded-lg text-sm font-bold hover:bg-orange-50">Hard <span class="font-normal text-xs block">&lt;10m</span></button>
                <button data-action="good" class="py-3 bg-white border-2 border-green-200 text-green-600 rounded-lg text-sm font-bold hover:bg-green-50">Good <span class="font-normal text-xs block">1d</span></button>
                <button data-action="easy" class="py-3 bg-white border-2 border-blue-200 text-blue-600 rounded-lg text-sm font-bold hover:bg-blue-50">Easy <span class="font-normal text-xs block">3d</span></button>
              </div>
            </div>

            <!-- Deck Stats -->
            <div class="col-span-3 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
              <h3 class="text-sm font-bold text-gray-800 mb-3">Deck Stats</h3>
              <div id="deck-stats" class="space-y-2">
                <div class="flex justify-between items-center text-xs">
                  <span class="font-medium text-blue-600">New</span>
                  <span id="stat-new" class="font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">0</span> 
                </div>
                <div class="flex justify-between items-center text-xs">
                  <span class="font-medium text-orange-600">Learning</span>
                  <span id="stat-learning" class="font-bold bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">0</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                  <span class="font-medium text-green-600">Reviewing</span>
                  <span id="stat-reviewing" class="font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded-full">0</span>
                </div>
              </div>
              <hr class="my-3">
              <div class="flex justify-between items-center text-xs">
                <span class="font-medium text-gray-500">Completed</span>
                <span id="stat-completed" class="font-bold text-gray-500">0</span>
              </div>
              <a href="./deck-management.html" class="w-full mt-4 text-center text-xs font-bold text-gray-600 bg-gray-100 py-2 rounded-lg hover:bg-gray-200 block">
                ⚙️ Deck Settings
              </a>
              <button id="add-flashcard-btn" class="w-full mt-2 text-center text-xs font-bold text-blue-600 bg-blue-50 py-2 rounded-lg hover:bg-blue-100">+ Add Flashcard</button>
              <button id="edit-flashcard-btn" class="w-full mt-2 text-center text-xs font-bold text-gray-600 bg-gray-100 py-2 rounded-lg hover:bg-gray-200">✏️ Edit Current Card</button>
              <button id="delete-flashcard-btn" class="w-full mt-1 text-center text-xs font-bold text-red-600 bg-red-50 py-2 rounded-lg hover:bg-red-100">🗑️ Delete Current Card</button>
            </div>

          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Add Flashcard Modal -->
  <div id="add-flashcard-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 class="text-lg font-bold text-gray-800">Add New Flashcard</h3>
        <button id="close-modal-btn" class="text-gray-400 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="add-flashcard-form" class="p-6 space-y-4">
        <div>
          <label for="card-front-input" class="text-sm font-semibold text-gray-700">Front</label>
          <textarea id="card-front-input" rows="3" placeholder="Question or term..." class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200 resize-none" required></textarea>
        </div>
        <div>
          <label for="card-back-input" class="text-sm font-semibold text-gray-700">Back</label>
          <textarea id="card-back-input" rows="3" placeholder="Answer or definition..." class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200 resize-none" required></textarea>
        </div>
        <div>
          <label for="card-deck-input" class="text-sm font-semibold text-gray-700">Deck</label>
          <input type="text" id="card-deck-input" placeholder="e.g., Physics Chapter 1" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200" required>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="cancel-modal-btn" class="text-xs font-semibold text-gray-500 bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2 rounded-lg shadow-sm">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Flashcard Modal -->
  <div id="edit-flashcard-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 class="text-lg font-bold text-gray-800">Edit Flashcard</h3>
        <button id="close-edit-modal-btn" class="text-gray-400 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="edit-flashcard-form" class="p-6 space-y-4">
        <div>
          <label for="edit-card-front-input" class="text-sm font-semibold text-gray-700">Front</label>
          <textarea id="edit-card-front-input" rows="3" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200 resize-none" required></textarea>
        </div>
        <div>
          <label for="edit-card-back-input" class="text-sm font-semibold text-gray-700">Back</label>
          <textarea id="edit-card-back-input" rows="3" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200 resize-none" required></textarea>
        </div>
        <div>
          <label for="edit-card-deck-input" class="text-sm font-semibold text-gray-700">Deck</label>
          <input type="text" id="edit-card-deck-input" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200" required>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="cancel-edit-modal-btn" class="text-xs font-semibold text-gray-500 bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2 rounded-lg shadow-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
     document.addEventListener('DOMContentLoaded', async function() {
        const FLASHCARDS_KEY = 'acognix_flashcards';
        const sidebarContainer = document.getElementById('sidebar-container');
        const currentUser = await window.getCurrentUser();

        if (!currentUser) {
            window.location.href = '../auth/login.html';
            return;
        }

        const role = currentUser.role;
        const userAvatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;

        const studentSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" /><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" /></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
                    <a href="./ai-workspace.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>AI Workspace</a>
                    <a href="./my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>My Courses</a>
                    <a href="./flashcards.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Flashcards</a>
                    <a href="./deck-management.html" class="flex items-center gap-3 pl-11 pr-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">Manage Decks</a>
                    <a href="./quizzes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Quizzes</a>
                    <a href="./notes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Notes</a>
                    <a href="../shared/community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Community</a>
                    <a href="./progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>Progress</a>
                    <a href="../auth/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>Settings</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img id="user-avatar-sidebar" src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight">${currentUser.fullname}</p>
                        <p id="user-role-sidebar" class="text-[10px] text-gray-400">${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)}</p>
                    </div>
                    <a href="../auth/settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>
                </div>
            </div>
        `;
        // Simplified templates for other roles
        const teacherSidebarTemplate = `<div>Teacher Sidebar</div>`;
        const adminSidebarTemplate = `<div>Admin Sidebar</div>`;

        if (role === 'teacher') {
            sidebarContainer.innerHTML = teacherSidebarTemplate;
        } else if (role === 'admin') {
            sidebarContainer.innerHTML = adminSidebarTemplate;
        } else {
            sidebarContainer.innerHTML = studentSidebarTemplate;
        }

        // Update topbar
        document.getElementById('user-greeting-topbar').textContent = `Hi, ${currentUser.fullname}`;
        document.getElementById('user-role-topbar').textContent = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('user-avatar-topbar').src = userAvatarUrl.replace('size=36', 'size=32');


        // --- DOM Elements ---
        const deckTitleEl = document.getElementById('deck-title');
        const deckSelectorEl = document.getElementById('deck-selector');
        const cardProgressEl = document.getElementById('card-progress');
        const progressBarEl = document.getElementById('progress-bar');
        const flashcardFrontEl = document.getElementById('flashcard-front');
        const flashcardBackEl = document.getElementById('flashcard-back');
        const flashcardBackOverlayEl = document.getElementById('flashcard-back-overlay');
        const showAnswerBtn = document.getElementById('show-answer-btn');
        const confidenceButtonsContainer = document.getElementById('confidence-buttons');
        const addFlashcardBtn = document.getElementById('add-flashcard-btn');
        const modal = document.getElementById('add-flashcard-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const addFlashcardForm = document.getElementById('add-flashcard-form');
        const endSessionBtn = document.querySelector('header button.text-gray-500');
        const editFlashcardBtn = document.getElementById('edit-flashcard-btn');
        const deleteFlashcardBtn = document.getElementById('delete-flashcard-btn');

        // Edit Modal Elements
        const editModal = document.getElementById('edit-flashcard-modal');
        const closeEditModalBtn = document.getElementById('close-edit-modal-btn');
        const cancelEditModalBtn = document.getElementById('cancel-edit-modal-btn');
        const editFlashcardForm = document.getElementById('edit-flashcard-form');
        const editCardFrontInput = document.getElementById('edit-card-front-input');
        const editCardBackInput = document.getElementById('edit-card-back-input');
        const editCardDeckInput = document.getElementById('edit-card-deck-input');

        let allUserFlashcards = []; 
        let currentDeckCards = [];
        let currentCardIndex = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const deckFromUrl = urlParams.get('deck');

        function populateDeckSelector() {
            const decks = [...new Set(allUserFlashcards.map(fc => fc.deck))];
            deckSelectorEl.innerHTML = decks.map(deck => `<option value="${deck}">${deck}</option>`).join('');
        }

        function loadFlashcards() {
            const allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
            allUserFlashcards = allFlashcards.filter(fc => fc.userId === currentUser.email);

            populateDeckSelector();

            if (deckFromUrl && [...deckSelectorEl.options].some(o => o.value === deckFromUrl)) {
                deckSelectorEl.value = deckFromUrl;
            }

            const selectedDeck = deckSelectorEl.value;

            currentDeckCards = allUserFlashcards.filter(fc => fc.deck === selectedDeck);

            if (currentDeckCards.length === 0) {
                deckTitleEl.textContent = selectedDeck || 'No Deck Selected';
                cardProgressEl.textContent = 'Card 0 of 0';
                progressBarEl.style.width = '0%';
                flashcardFrontEl.textContent = 'Add a flashcard to this deck to get started!';
                flashcardBackEl.textContent = 'The answer will appear here.';
                showAnswerBtn.style.display = 'none';
                editFlashcardBtn.style.display = 'none';
                deleteFlashcardBtn.style.display = 'none';
                confidenceButtonsContainer.classList.add('hidden');
                updateDeckStats();
                return;
            }

            currentDeckCards.sort((a, b) => {
                const statusOrder = { 'new': 0, 'learning': 1, 'reviewing': 2 };
                return (statusOrder[a.status] || 99) - (statusOrder[b.status] || 99);
            });

            currentCardIndex = 0;
            deckTitleEl.textContent = selectedDeck;
            displayCurrentCard();
            editFlashcardBtn.style.display = 'block';
            deleteFlashcardBtn.style.display = 'block';
            updateDeckStats();
        }

        function displayCurrentCard() {
            if (currentDeckCards.length === 0 || currentCardIndex >= currentDeckCards.length) {
                alert('Deck completed! Reloading for another round or choose another deck.');
                loadFlashcards();
                return;
            }

            const currentCard = currentDeckCards[currentCardIndex];

            cardProgressEl.textContent = `Card ${currentCardIndex + 1} of ${currentDeckCards.length}`;
            progressBarEl.style.width = `${((currentCardIndex + 1) / currentDeckCards.length) * 100}%`;
            
            // LƯU Ý BẢO MẬT: Dùng textContent để chống XSS
            flashcardFrontEl.textContent = currentCard.front;
            flashcardBackEl.textContent = currentCard.back;

            flashcardBackOverlayEl.classList.add('opacity-0', 'pointer-events-none');
            showAnswerBtn.style.display = 'block';
            confidenceButtonsContainer.classList.add('hidden');
        }

        function showAnswer() {
            if (currentDeckCards.length === 0) return;
            flashcardBackOverlayEl.classList.remove('opacity-0', 'pointer-events-none');
            showAnswerBtn.style.display = 'none';
            confidenceButtonsContainer.classList.remove('hidden');
        }

        function recordAnswer(confidence) {
            if (currentDeckCards.length === 0) return;

            const currentCard = currentDeckCards[currentCardIndex];
            let newStatus = 'reviewing';
            if (confidence === 'again') newStatus = 'new';
            if (confidence === 'hard') newStatus = 'learning';
            if (confidence === 'easy') newStatus = 'completed';

            currentCard.status = newStatus;
            currentCard.lastReviewed = new Date().toISOString().split('T')[0];

            let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
            const indexInAll = allFlashcards.findIndex(fc => fc.id === currentCard.id);
            if (indexInAll > -1) {
                allFlashcards[indexInAll] = currentCard;
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(allFlashcards));
            }

            currentCardIndex++;
            displayCurrentCard();
            updateDeckStats();
        }

        function updateDeckStats() {
            const selectedDeck = deckSelectorEl.value;
            const cardsInDeck = allUserFlashcards.filter(fc => fc.deck === selectedDeck);
            document.getElementById('stat-new').textContent = cardsInDeck.filter(fc => fc.status === 'new').length;
            document.getElementById('stat-learning').textContent = cardsInDeck.filter(fc => fc.status === 'learning').length;
            document.getElementById('stat-reviewing').textContent = cardsInDeck.filter(fc => fc.status === 'reviewing').length;
            const completedCount = cardsInDeck.filter(fc => fc.status === 'completed').length;
            document.getElementById('stat-completed').textContent = completedCount;
        }

        // --- Modal Logic ---
        function openModal() {
            modal.classList.remove('hidden');
            document.getElementById('card-deck-input').value = deckSelectorEl.value || '';
        }
        function closeAddModal() { modal.classList.add('hidden'); addFlashcardForm.reset(); }

        addFlashcardBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeAddModal);
        cancelModalBtn.addEventListener('click', closeAddModal);
        
        addFlashcardForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const front = document.getElementById('card-front-input').value.trim();
            const back = document.getElementById('card-back-input').value.trim();
            const deck = document.getElementById('card-deck-input').value.trim();

            if (!front || !back || !deck) {
                alert('Please fill all fields.');
                return;
            }

            let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
            const newId = allFlashcards.length > 0 ? Math.max(...allFlashcards.map(fc => fc.id)) + 1 : 1;

            const newCard = {
                id: newId,
                userId: currentUser.email,
                deck: deck,
                front: front,
                back: back,
                status: 'new',
                lastReviewed: null
            };

            allFlashcards.push(newCard);
            localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(allFlashcards));
            
            alert('Flashcard added successfully!');
            closeAddModal();
            loadFlashcards(); 
        });

        // --- Edit & Delete Logic ---
        function openEditModal() {
            if (currentDeckCards.length === 0) return;
            const cardToEdit = currentDeckCards[currentCardIndex];
            
            editCardFrontInput.value = cardToEdit.front;
            editCardBackInput.value = cardToEdit.back;
            editCardDeckInput.value = cardToEdit.deck;

            editModal.classList.remove('hidden');
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
            editFlashcardForm.reset();
        }

        editFlashcardForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (currentDeckCards.length === 0) return;

            const cardToEdit = currentDeckCards[currentCardIndex];
            const newFront = editCardFrontInput.value.trim();
            const newBack = editCardBackInput.value.trim();
            const newDeck = editCardDeckInput.value.trim();

            if (!newFront || !newBack || !newDeck) {
                alert('Please fill all fields.');
                return;
            }

            let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
            const indexInAll = allFlashcards.findIndex(fc => fc.id === cardToEdit.id);

            if (indexInAll > -1) {
                allFlashcards[indexInAll].front = newFront;
                allFlashcards[indexInAll].back = newBack;
                allFlashcards[indexInAll].deck = newDeck;
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(allFlashcards));
                alert('Flashcard updated successfully!');
                closeEditModal();
                loadFlashcards();
            }
        });

        function deleteCurrentCard() {
            if (currentDeckCards.length === 0) return;
            const cardToDelete = currentDeckCards[currentCardIndex];
            if (confirm(`Are you sure you want to delete this flashcard?\n\nFront: "${cardToDelete.front}"`)) {
                let allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
                const updatedFlashcards = allFlashcards.filter(fc => fc.id !== cardToDelete.id);
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(updatedFlashcards));
                alert('Flashcard deleted.');
                loadFlashcards();
            }
        }

        // --- Initial Load ---
        showAnswerBtn.addEventListener('click', showAnswer);
        
        // CLEAN CODE: Đọc dữ liệu data-action thay vì UI text
        confidenceButtonsContainer.querySelectorAll('button').forEach(button => 
            button.addEventListener('click', (e) => {
                const action = e.currentTarget.dataset.action; 
                recordAnswer(action);
            })
        );
        
        deckSelectorEl.addEventListener('change', loadFlashcards);
        loadFlashcards();
        endSessionBtn.addEventListener('click', () => { window.location.href = './dashboard.html'; });

        editFlashcardBtn.addEventListener('click', openEditModal);
        deleteFlashcardBtn.addEventListener('click', deleteCurrentCard);
        closeEditModalBtn.addEventListener('click', closeEditModal);
        cancelEditModalBtn.addEventListener('click', closeEditModal);
    });
  </script>
  <script src="../shared/auth-guard.js"></script>
</body>
</html>
