<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <!-- Sidebar content will be dynamically injected here -->
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <div class="flex items-center gap-4">
          <h1 class="text-lg font-bold text-gray-800">My Progress</h1>
          <select class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white outline-none focus:ring-1 focus:ring-blue-300">
            <option>Last 7 days</option>
            <option>Last 30 days</option>
            <option>All time</option>
          </select>
        </div>
        <div id="user-profile-topbar" class="flex items-center gap-3 cursor-pointer">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
                <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
                <p id="user-role-topbar" class="text-[10px] text-gray-400">Role</p>
            </div>
        </div>
      </header>

      <!-- 3. PROGRESS CONTENT -->
      <main class="p-6 space-y-6">
        <!-- Key Metrics -->
        <div class="grid grid-cols-4 gap-6">
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition-transform hover:-translate-y-1">
            <p class="text-sm font-medium text-gray-500">Est. Time Studied</p>
            <p id="time-studied" class="text-3xl font-bold text-blue-600 mt-1">0h 0m</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition-transform hover:-translate-y-1">
            <p class="text-sm font-medium text-gray-500">Courses Mastered</p>
            <p id="courses-completed" class="text-3xl font-bold text-gray-800 mt-1">0</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition-transform hover:-translate-y-1">
            <p class="text-sm font-medium text-gray-500">Flashcards Reviewed</p>
            <p id="flashcards-reviewed" class="text-3xl font-bold text-gray-800 mt-1">0</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm transition-transform hover:-translate-y-1">
            <p class="text-sm font-medium text-gray-500">Quizzes Passed</p>
            <p id="quizzes-passed" class="text-3xl font-bold text-gray-800 mt-1">0</p>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-6">
          <!-- Study Time Chart -->
          <div class="col-span-2 bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
            <h3 class="text-base font-bold text-gray-800 mb-4">Study Time (Last 7 Days)</h3>
            <div class="h-64">
              <canvas id="studyTimeChartCanvas"></canvas>
            </div>
          </div>
          <!-- Activity Feed -->
          <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col">
            <h3 class="text-sm font-bold text-gray-800 mb-4 flex-shrink-0">Recent Activity</h3>
            <div id="activity-feed-list" class="space-y-4 overflow-y-auto flex-1 pr-2">
              <!-- Activities will be injected here -->
            </div>
          </div>
        </div>

        <!-- Progress by Course -->
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
          <h3 class="text-sm font-bold text-gray-800 mb-4">Progress by Enrolled Course</h3>
          <div id="course-progress-list" class="space-y-4 grid grid-cols-2 gap-4">
            <!-- Course progress will be dynamically inserted here -->
          </div>
        </div>
      </main>

    </div>
  </div>

        );

                    <a href="./admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Dashboard</a>
                    <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>User Management</a>
                    <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>Course Management</a>
                    <a href="../shared/community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>Community</a>
                    <a href="./admin-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>Analytics & Progress</a>
                    <a href="../auth/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Settings</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100 mt-auto">
                <div class="flex items-center gap-3 cursor-pointer">
                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover bg-gray-200">
                    <div class="text-left flex-1 overflow-hidden">
                        <p class="text-xs font-bold text-gray-800 leading-tight truncate">${safeFullname}</p>
                        <p class="text-[10px] text-gray-400">Admin</p>
                    </div>
                    <a href="../auth/settings.html" class="ml-auto flex-shrink-0"><span class="text-gray-400 text-[10px]">⚙️</span></a>
                </div>
            </div>
        `;

        if (role === 'teacher') sidebarContainer.innerHTML = teacherSidebarTemplate;
        else if (role === 'admin') sidebarContainer.innerHTML = adminSidebarTemplate;
        else sidebarContainer.innerHTML = studentSidebarTemplate;

        // --- Cập nhật Topbar ---
        document.getElementById('user-greeting-topbar').textContent = `Hi, ${safeFullname}`;
        document.getElementById('user-role-topbar').textContent = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('user-avatar-topbar').src = userAvatarUrl;

        // ==========================================
        // 2. TRÍCH XUẤT DỮ LIỆU THẬT & TÍNH TOÁN
        // ==========================================
        const allUsers = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        const allCourses = JSON.parse(localStorage.getItem(COURSES_KEY)) || [];
        const allFlashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || [];
        const allQuizzes = JSON.parse(localStorage.getItem(QUIZZES_KEY)) || [];
        const allNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];

        const fullCurrentUser = allUsers.find(u => u.email === currentUser.email);
        const enrolledCourseIds = fullCurrentUser ? fullCurrentUser.enrolledCourses || [] : [];

        // Trích xuất mảng dữ liệu thuộc về User
        const myCourses = allCourses.filter(course => enrolledCourseIds.includes(course.id));
        const myFlashcards = allFlashcards.filter(fc => fc.userId === currentUser.email);
        const myNotes = allNotes.filter(note => note.userId === currentUser.email);
        
        // Quizzes mà User đã làm (có thuộc tính results chứa email)
        const myQuizzesTaken = allQuizzes.filter(q => q.results && q.results[currentUser.email]);

        // Tính toán Chỉ số Thống kê (Key Metrics)
        // Ước tính giờ học: 15p/Quiz, 10p/Note, 2p/Flashcard
        const estimatedMinutes = (myQuizzesTaken.length * 15) + (myNotes.length * 10) + (myFlashcards.length * 2);
        document.getElementById('time-studied').textContent = `${Math.floor(estimatedMinutes / 60)}h ${estimatedMinutes % 60}m`;

        // Flashcards Reviewed: Trạng thái khác 'new'
        const reviewedFlashcardsCount = myFlashcards.filter(fc => fc.status !== 'new').length;
        document.getElementById('flashcards-reviewed').textContent = reviewedFlashcardsCount;

        // Quizzes Passed: Điểm >= 70%
        const passedQuizzesCount = myQuizzesTaken.filter(q => q.results[currentUser.email].score >= 70).length;
        document.getElementById('quizzes-passed').textContent = passedQuizzesCount;

        // ==========================================
        // 3. TẠO ACTIVITY FEED (NHẬT KÝ HOẠT ĐỘNG)
        // ==========================================
        let activities = [];
        
        // Thêm Quiz vào Feed
        myQuizzesTaken.forEach(q => {
            activities.push({ 
                type: 'quiz', 
                title: `Scored ${q.results[currentUser.email].score}% on "${q.title}"`, 
                dateObj: new Date(q.results[currentUser.email].date),
                icon: '🧠', bgClass: 'bg-blue-100 text-blue-600'
            });
        });

        // Thêm Note vào Feed
        myNotes.forEach(n => {
            // Note date đang lưu định dạng "Month DD, YYYY H:M", parse qua Date obj
            activities.push({ 
                type: 'note', 
                title: `Created note: "${n.title || 'Untitled'}"`, 
                dateObj: new Date(n.date),
                icon: '📝', bgClass: 'bg-purple-100 text-purple-600'
            });
        });

        // Sắp xếp ngày gần nhất
        activities.sort((a, b) => b.dateObj - a.dateObj);
        
        const feedContainer = document.getElementById('activity-feed-list');
        feedContainer.innerHTML = '';
        if (activities.length === 0) {
            feedContainer.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No recent activity found.</p>`;
        } else {
            // Lấy 6 hoạt động gần nhất
            activities.slice(0, 6).forEach(act => {
                const timeDiff = Math.floor((new Date() - act.dateObj) / 60000);
                const timeStr = timeDiff < 60 ? `${timeDiff}m ago` : (timeDiff < 1440 ? `${Math.floor(timeDiff/60)}h ago` : `${Math.floor(timeDiff/1440)}d ago`);
                
                feedContainer.innerHTML += `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 ${act.bgClass} rounded-lg flex items-center justify-center text-sm">${act.icon}</div>
                        <div>
                            <p class="text-xs font-bold text-gray-800">${escapeHTML(act.title)}</p>
                            <p class="text-[11px] text-gray-400">${timeStr}</p>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // 4. TIẾN ĐỘ KHÓA HỌC (COURSE PROGRESS)
        // ==========================================
        const progressListContainer = document.getElementById('course-progress-list');
        progressListContainer.innerHTML = '';
        let coursesMastered = 0;

        if (myCourses.length === 0) {
            progressListContainer.innerHTML = `<p class="text-center text-gray-500 text-sm col-span-2">No courses enrolled.</p>`;
        } else {
            myCourses.forEach(course => {
                // Lấy tất cả Quiz thuộc khóa học này
                const courseQuizzes = allQuizzes.filter(q => q.courseId === course.id);
                let progress = 0;

                if (courseQuizzes.length > 0) {
                    // Đếm số quiz User đã Pass trong khóa học
                    const passedCourseQuizzes = courseQuizzes.filter(q => q.results && q.results[currentUser.email] && q.results[currentUser.email].score >= 70).length;
                    progress = Math.round((passedCourseQuizzes / courseQuizzes.length) * 100);
                }

                if (progress === 100) coursesMastered++;

                let progressColor = 'bg-emerald-500';
                let textColor = 'text-emerald-600';
                if (progress < 70) { progressColor = 'bg-amber-500'; textColor = 'text-amber-600'; }
                if (progress === 0) { progressColor = 'bg-gray-300'; textColor = 'text-gray-500'; }

                const courseHtml = `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-sm font-bold text-gray-800 truncate pr-2" title="${escapeHTML(course.name)}">${escapeHTML(course.name)}</p>
                            <p class="text-xs font-black ${textColor}">${progress}%</p>
                        </div>
                        <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                            <div class="${progressColor} h-full transition-all duration-1000 ease-out" style="width: ${progress}%"></div>
                        </div>
                    </div>
                `;
                progressListContainer.innerHTML += courseHtml;
            });
        }
        document.getElementById('courses-completed').textContent = coursesMastered;

        // ==========================================
        // 5. RENDER BIỂU ĐỒ ĐỘNG 7 NGÀY QUA
        // ==========================================
        const chartLabels = [];
        const chartDataArray = [];
        
        // Tạo nhãn cho 7 ngày qua (Thứ)
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            chartLabels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
            
            // Tính số phút học của ngày đó từ activities
            const dateStrToMatch = d.toISOString().split('T')[0];
            let minsInDay = 0;
            activities.forEach(act => {
                if (act.dateObj.toISOString().split('T')[0] === dateStrToMatch) {
                    if (act.type === 'quiz') minsInDay += 15;
                    if (act.type === 'note') minsInDay += 10;
                }
            });
            // Quy đổi ra giờ
            chartDataArray.push(Number((minsInDay / 60).toFixed(1)));
        }

        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: (c) => `${c.parsed.y} hours` } }
            },
            scales: {
                y: { beginAtZero: true, ticks: { callback: (v) => `${v}h` } },
                x: { grid: { display: false } }
            }
        };

        const studyTimeCtx = document.getElementById('studyTimeChartCanvas').getContext('2d');
        studyTimeChartInstance = new Chart(studyTimeCtx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: 'Study Hours',
                    data: chartDataArray,
                    backgroundColor: '#DBEAFE', // blue-100
                    hoverBackgroundColor: '#3B82F6', // blue-500
                    borderRadius: 6,
                }]
            }, 
            options: chartOptions
        });

    });
  </script>

  <script src="../shared/auth-guard.js"></script>
</body>
