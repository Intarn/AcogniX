<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <!-- Sidebar content will be dynamically injected here -->
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800" id="topbar-title">Quiz in Progress...</h1>
        <div class="flex items-center gap-5">
          <button id="end-quiz-btn-topbar" class="text-xs font-semibold text-red-600 bg-red-50 px-4 py-2 rounded-lg hover:bg-red-100 transition-colors">Submit Quiz Early</button>
          <div class="flex items-center gap-3 cursor-pointer">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
              <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
              <p id="user-role-topbar" class="text-[10px] text-gray-400">Role</p>
            </div>
          </div>
        </div>
      </header>

      <!-- 3. QUIZ CONTENT (Vùng làm bài) -->
      <main id="quiz-workspace" class="flex-1 flex items-center justify-center p-6 bg-gray-100/30 overflow-y-auto w-full">
        <div class="w-full max-w-4xl mx-auto" id="quiz-main-container">
          
          <!-- Quiz Header -->
          <div class="mb-5">
            <div class="flex justify-between items-center mb-2">
              <h2 id="quiz-title" class="text-xl font-bold text-gray-800">Loading Quiz...</h2>
              <p class="text-sm font-semibold text-gray-500">Question <span id="current-question-num" class="text-blue-600 font-bold text-base">0</span> of <span id="total-questions">0</span></p>
            </div>
            <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
              <div id="quiz-progress-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>

          <div class="grid grid-cols-12 gap-6 items-start">
            
            <!-- Main Quiz Area -->
            <div class="col-span-8 flex flex-col h-full">
              <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm flex-1">
                <p id="question-text" class="text-lg font-semibold text-gray-800 leading-relaxed mb-6">Loading question...</p>
                <div id="options-container" class="space-y-3">
                  <!-- Options render here -->
                </div>
              </div>

              <!-- Navigation Buttons -->
              <div class="mt-6 flex justify-between items-center bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <button id="prev-btn" class="px-5 py-2.5 text-sm font-bold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                  Previous
                </button>
                <button id="next-btn" class="px-5 py-2.5 text-sm font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm flex items-center gap-2">
                  Next
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              </div>
            </div>

            <!-- Quiz Stats -->
            <div class="col-span-4 bg-white rounded-2xl border border-gray-100 p-4 shadow-sm">
              <h3 class="text-sm font-bold text-gray-800 mb-3 uppercase tracking-wider">Status</h3>
              <div class="space-y-3">
                <div class="flex justify-between items-center text-sm p-4 bg-red-50 rounded-xl border border-red-100">
                  <span class="font-bold text-red-600 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Time Left
                  </span>
                  <span id="time-remaining" class="font-black text-red-600 text-lg">00:00</span>
                </div>
                <div class="flex justify-between items-center text-xs p-3 bg-gray-50 rounded-lg">
                  <span class="font-medium text-gray-500">Answered</span>
                  <span id="answered-count" class="font-bold text-blue-600">0 / 0</span>
                </div>
                <div class="flex justify-between items-center text-xs p-3 bg-gray-50 rounded-lg">
                  <span class="font-medium text-gray-500">Unanswered</span>
                  <span id="remaining-count" class="font-bold text-orange-600">0 / 0</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      </main>

      <!-- 4. RESULT SCREEN (Ẩn mặc định) -->
      <main id="result-workspace" class="flex-1 items-center justify-center p-6 bg-gray-100/30 overflow-y-auto hidden">
        <div class="w-full max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden text-center">
          <div class="bg-blue-600 p-8 text-white">
            <h2 class="text-3xl font-black mb-2">Quiz Completed!</h2>
            <p class="text-blue-100">Here is how you performed.</p>
          </div>
          <div class="p-8">
            <div class="flex justify-center mb-6">
              <div class="w-32 h-32 rounded-full border-8 border-blue-100 flex items-center justify-center relative">
                <span id="final-score-text" class="text-4xl font-black text-blue-600">0%</span>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8">
              <div class="p-4 bg-green-50 rounded-xl border border-green-100">
                <p class="text-xs font-bold text-green-600 uppercase mb-1">Correct Answers</p>
                <p id="correct-count-text" class="text-2xl font-black text-green-700">0</p>
              </div>
              <div class="p-4 bg-red-50 rounded-xl border border-red-100">
                <p class="text-xs font-bold text-red-600 uppercase mb-1">Incorrect / Skipped</p>
                <p id="incorrect-count-text" class="text-2xl font-black text-red-700">0</p>
              </div>
            </div>
            <div class="flex justify-center gap-4">
              <a href="./my-courses.html" class="px-6 py-3 text-sm font-bold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">Back to Courses</a>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    const escapeHTML = (str) => {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    };

            return;

                <div class="flex items-center gap-3">
                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover bg-gray-200">
                    <div class="text-left flex-1 overflow-hidden">
                        <p class="text-xs font-bold text-gray-800 leading-tight truncate">${safeFullname}</p>

                    <a href="../auth/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Settings</a>

                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p class="text-xs font-bold text-gray-800 leading-tight">${safeFullname}</p>
                        <p class="text-[10px] text-gray-400">Teacher</p>

                    <a href="../auth/settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>

        const adminSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF"></stop><stop offset="100%" stop-color="#3B82F6"></stop></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF"></stop><stop offset="50%" stop-color="#3B82F6"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round"></path><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)"></path></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Dashboard</a>
                    <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>User Management</a>
                    <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>Course Management</a>
                    <a href="./admin-community-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>Community</a>
                    <a href="./admin-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>Analytics</a>
                    <a href="./admin-settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>System Settings</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p class="text-xs font-bold text-gray-800 leading-tight">${safeFullname}</p>
                        <p class="text-[10px] text-gray-400">Admin</p>
                    </div>
                    <a href="../auth/settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>
                </div>
            </div>
        `;

        if (role === 'teacher') {
            sidebarContainer.innerHTML = teacherSidebarTemplate;
        } else if (role === 'admin') {
            sidebarContainer.innerHTML = adminSidebarTemplate;
        } else {
            sidebarContainer.innerHTML = studentSidebarTemplate;
        }

        // --- Topbar Setup ---
        document.getElementById('user-greeting-topbar').textContent = `Hi, ${safeFullname}`;
        document.getElementById('user-role-topbar').textContent = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('user-avatar-topbar').src = userAvatarUrl;

        // --- Logic DOM Elements ---
        const topbarTitleEl = document.getElementById('topbar-title');
        const quizWorkspace = document.getElementById('quiz-workspace');
        const resultWorkspace = document.getElementById('result-workspace');
        const quizMainContainer = document.getElementById('quiz-main-container');
        
        const quizTitleEl = document.getElementById('quiz-title');
        const currentQuestionNumEl = document.getElementById('current-question-num');
        const totalQuestionsEl = document.getElementById('total-questions');
        const quizProgressBarEl = document.getElementById('quiz-progress-bar');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const endQuizBtnTopbar = document.getElementById('end-quiz-btn-topbar');
        
        const timeRemainingEl = document.getElementById('time-remaining');
        const answeredCountEl = document.getElementById('answered-count');
        const remainingCountEl = document.getElementById('remaining-count');

        // --- State Variables ---
        let currentQuiz = null;
        let currentQuestionIndex = 0;
        let userAnswers = []; 
        let timeRemainingInSeconds = 0;
        let timerInterval;

        const urlParams = new URLSearchParams(window.location.search);
        const quizId = parseInt(urlParams.get('id')); 

        currentQuiz = allQuizzes.find(q => q.id === quizId);

        // ERROR HANDLING
        if (!quizId || !currentQuiz || !currentQuiz.questions || currentQuiz.questions.length === 0) {
            topbarTitleEl.textContent = "Error";
            endQuizBtnTopbar.style.display = 'none';
            
            quizMainContainer.innerHTML = `
                <div class="text-center p-12 bg-white rounded-3xl shadow-sm border border-gray-100 max-w-lg mx-auto mt-10">
                    <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="text-3xl">⚠️</span>
                    </div>
                    <h2 class="text-2xl font-black text-gray-800 mb-3">Quiz Not Found</h2>
                    <p class="text-gray-500 mb-8 leading-relaxed">The quiz you are looking for does not exist, has no questions, or the ID is missing. Please select a valid quiz from your courses.</p>
                    <a href="./my-courses.html" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-sm inline-block transition-colors">Back to Courses</a>
                </div>
            `;
            return; 
        }

        // --- Core Functions ---
        function startQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuiz.questions.length).fill(null);
            
            const minutes = currentQuiz.timeLimit || 10;
            timeRemainingInSeconds = minutes * 60;
            
            updateTimerDisplay();
            timerInterval = setInterval(handleTimerTick, 1000);
            
            renderQuestion();
        }

        function handleTimerTick() {
            timeRemainingInSeconds--;
            updateTimerDisplay();
            
            if (timeRemainingInSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting your quiz automatically.");
                finishQuiz();
            }
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(timeRemainingInSeconds / 60)).padStart(2, '0');
            const secs = String(timeRemainingInSeconds % 60).padStart(2, '0');
            timeRemainingEl.textContent = `${mins}:${secs}`;
            
            if (timeRemainingInSeconds < 60) {
                timeRemainingEl.classList.add('animate-pulse');
            }
        }

        function renderQuestion() {
            const question = currentQuiz.questions[currentQuestionIndex];
            const total = currentQuiz.questions.length;
            
            quizTitleEl.textContent = escapeHTML(currentQuiz.title);
            currentQuestionNumEl.textContent = currentQuestionIndex + 1;
            totalQuestionsEl.textContent = total;
            quizProgressBarEl.style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;
            
            questionTextEl.textContent = escapeHTML(question.q);
            optionsContainerEl.innerHTML = '';
            
            question.options.forEach(option => {
                const isSelected = userAnswers[currentQuestionIndex] === option;
                const safeOption = escapeHTML(option);

                const label = document.createElement('label');
                label.className = `flex items-center gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all ${isSelected ? 'border-blue-500 bg-blue-50' : 'border-gray-100 hover:border-blue-200 hover:bg-gray-50'}`;
                
                label.innerHTML = `
                    <input type="radio" name="quiz_option" value="${safeOption}" class="hidden" ${isSelected ? 'checked' : ''}>
                    <span class="w-6 h-6 border-2 flex-shrink-0 rounded-full flex items-center justify-center ${isSelected ? 'bg-blue-500 border-blue-500' : 'border-gray-300'}">
                        <span class="w-2 h-2 bg-white rounded-full ${isSelected ? 'block' : 'hidden'}"></span>
                    </span>
                    <span class="text-sm font-medium text-gray-700">${safeOption}</span>
                `;

                label.querySelector('input').addEventListener('change', (e) => {
                    userAnswers[currentQuestionIndex] = e.target.value;
                    renderQuestion();
                    updateStats();
                });

                optionsContainerEl.appendChild(label);
            });

            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === total - 1) {
                nextBtn.innerHTML = `Finish Quiz <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                nextBtn.classList.replace('bg-blue-600', 'bg-green-600');
                nextBtn.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
            } else {
                nextBtn.innerHTML = `Next <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                nextBtn.classList.replace('bg-green-600', 'bg-blue-600');
                nextBtn.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
            }
            
            updateStats();
        }

        function updateStats() {
            const answered = userAnswers.filter(a => a !== null).length;
            const total = currentQuiz.questions.length;
            answeredCountEl.textContent = `${answered} / ${total}`;
            remainingCountEl.textContent = `${total - answered} / ${total}`;
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            let correct = 0;
            currentQuiz.questions.forEach((q, index) => {
                if (userAnswers[index] === q.ans) correct++;
            });
            const total = currentQuiz.questions.length;
            const percentage = Math.round((correct / total) * 100);

            const quizzesFromStorage = JSON.parse(localStorage.getItem(QUIZZES_KEY)) || [];
            const quizIndex = quizzesFromStorage.findIndex(q => q.id === currentQuiz.id);
            if (quizIndex > -1) {
                if (!quizzesFromStorage[quizIndex].results) quizzesFromStorage[quizIndex].results = {};
                quizzesFromStorage[quizIndex].results[currentUser.email] = {
                    score: percentage,
                    correct: correct,
                    total: total,
                    date: new Date().toISOString()
                };
                localStorage.setItem(QUIZZES_KEY, JSON.stringify(quizzesFromStorage));
            }

            topbarTitleEl.textContent = "Quiz Results";
            endQuizBtnTopbar.style.display = 'none';
            quizWorkspace.classList.add('hidden');
            quizWorkspace.classList.remove('flex');
            
            resultWorkspace.classList.remove('hidden');
            resultWorkspace.classList.add('flex');

            document.getElementById('final-score-text').textContent = `${percentage}%`;
            document.getElementById('correct-count-text').textContent = correct;
            document.getElementById('incorrect-count-text').textContent = total - correct;
        }

        // --- Event Listeners ---
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < currentQuiz.questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                const unanswered = userAnswers.filter(a => a === null).length;
                let msg = "Submit your quiz now?";
                if (unanswered > 0) msg = `You have ${unanswered} unanswered questions. Are you sure you want to submit?`;
                
                if (confirm(msg)) finishQuiz();
            }
        });

        endQuizBtnTopbar.addEventListener('click', () => {
            if (confirm("Are you sure you want to submit early? Unanswered questions will be incorrect.")) {
                finishQuiz();
            }
        });

        startQuiz();
    }); 
  </script>
  <script src="../shared/auth-guard.js"></script>
</body>
