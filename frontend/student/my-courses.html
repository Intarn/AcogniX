<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <!-- Sidebar content will be injected here -->
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 flex-shrink-0">
        <div class="relative w-[480px]">
          <svg class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Search for courses, files, quizzes..." class="w-full bg-gray-50/80 text-xs rounded-full pl-10 pr-4 py-2 border border-gray-100 outline-none focus:bg-white focus:border-blue-300">
        </div>
        <div class="flex items-center gap-5">
          <button class="relative p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          </button>
          <div class="flex items-center gap-3 cursor-pointer">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
              <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
              <p id="user-role-topbar" class="text-[10px] text-gray-400">Student</p>
            </div>
            <span class="text-gray-400 text-[10px]">▼</span>
          </div>
        </div>
      </header>

      <!-- 3. MY COURSES CONTENT -->
      <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-2xl font-bold text-gray-800">My Courses</h1>
          <div class="flex items-center gap-2">
            <select class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white outline-none focus:ring-1 focus:ring-blue-300">
              <option>In Progress</option>
              <option>Completed</option>
              <option>All Courses</option>
            </select>
            <button id="join-class-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
              + Join a Class
            </button>
          </div>
        </div>

        <!-- Course Grid -->
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Course cards will be dynamically inserted here -->
        </div>
      </main>

    </div>
  </div>

  <!-- Join Class Modal -->
  <div id="join-class-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm">
      <div class="flex items-center justify-between p-4 border-b border-gray-200">
        <h3 class="text-lg font-bold text-gray-800">Join a Class</h3>
        <button id="close-modal-btn" class="text-gray-400 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <form id="join-class-form" class="p-6 space-y-4">
        <div>
          <label for="class-code-input" class="text-sm font-semibold text-gray-700">Enter Class Code</label>
          <input type="text" id="class-code-input" placeholder="Enter code from your teacher" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200" required>
        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="cancel-modal-btn" class="text-xs font-semibold text-gray-500 bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2 rounded-lg shadow-sm">Join Class</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const sidebarContainer = document.getElementById('sidebar-container');
        const currentUser = await window.getCurrentUser();
        if (!currentUser) {
            window.location.href = '../auth/login.html';
            return;
        }

        const role = currentUser.role;
        const userAvatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;

        const studentSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" /><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" /></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
                    <a href="./ai-workspace.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>AI Workspace</a>
                    <a href="./my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>My Courses</a>
                    <a href="./student-assignments.html" class="flex items-center gap-3 pl-11 pr-4 py-2 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">Assignments</a>
                    <a href="./flashcards.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Flashcards</a>
                    <a href="./quizzes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Quizzes</a>
                    <a href="./notes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Notes</a>
                    <a href="../shared/community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Community</a>
                    <a href="./progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>Progress</a>
                    <a href="../auth/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>Settings</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img id="user-avatar-sidebar" src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight">${currentUser.fullname}</p>
                        <p id="user-role-sidebar" class="text-[10px] text-gray-400">${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)}</p>
                    </div>
                    <a href="../auth/settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>
                </div>
            </div>
        `;
        // Simplified templates for other roles
        const teacherSidebarTemplate = `<div>Teacher Sidebar</div>`;
        const adminSidebarTemplate = `<div>Admin Sidebar</div>`;

        if (role === 'teacher') {
            sidebarContainer.innerHTML = teacherSidebarTemplate;
        } else if (role === 'admin') {
            sidebarContainer.innerHTML = adminSidebarTemplate;
        } else {
            sidebarContainer.innerHTML = studentSidebarTemplate;
        }

        // Update topbar
        document.getElementById('user-greeting-topbar').textContent = `Hi, ${currentUser.fullname}`;
        document.getElementById('user-role-topbar').textContent = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('user-avatar-topbar').src = userAvatarUrl.replace('size=36', 'size=32');

        const coursesGrid = document.getElementById('courses-grid');

        // New modal elements
        const joinClassModal = document.getElementById('join-class-modal');
        const joinClassBtn = document.getElementById('join-class-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const joinClassForm = document.getElementById('join-class-form');

        function renderMyCourses() {
            const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];
            const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
            const fullCurrentUser = allUsers.find(u => u.email === currentUser.email);
            const enrolledCourseIds = fullCurrentUser ? fullCurrentUser.enrolledCourses || [] : [];

            const myCourses = allCourses.filter(course => enrolledCourseIds.includes(course.id));

            coursesGrid.innerHTML = '';
            if (myCourses.length === 0) {
                coursesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">You are not enrolled in any courses yet.</p>`;
            } else {
                myCourses.forEach(course => {
                const progress = Math.floor(Math.random() * 100); // Mock progress
                // Generate a consistent mock progress for each course based on its ID
                // This makes it "sticky" for the same course
                const consistentProgress = (course.id * 13 + 7) % 100; // A simple deterministic mock
                const isCompleted = consistentProgress >= 95; // Consider completed if progress is high
                let progressColor = 'bg-emerald-500';
                if (progress < 70) progressColor = 'bg-amber-500';
                if (progress < 40) progressColor = 'bg-red-500';

                    const cardHtml = `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col ${isCompleted ? 'opacity-70' : ''}" data-course-id="${course.id}">
                        <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&auto=format&fit=crop&q=80&ixid=${course.id}" class="h-32 w-full object-cover">
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="text-sm font-bold text-gray-800 mb-1">${course.name}</h3>
                            <p class="text-[11px] text-gray-400 mb-3">By ${course.teacher}</p>
                            <div class="mt-auto">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[10px] text-gray-500">Progress</span>
                                    <span class="text-[10px] font-semibold ${isCompleted ? 'text-gray-500' : 'text-emerald-600'}">${isCompleted ? '100% Completed' : consistentProgress + '%'}</span>
                                </div>
                                <div class="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden mb-3">
                                    <div class="${isCompleted ? 'bg-gray-400' : progressColor} h-full" style="width: ${consistentProgress}%"></div>
                                </div>
                                <a href="./course-detail.html?id=${course.id}" class="block w-full text-center ${isCompleted ? 'bg-gray-100 hover:bg-gray-200 text-gray-600' : 'bg-blue-50 hover:bg-blue-100 text-blue-600'} font-bold text-xs py-2 rounded-lg transition-colors">
                                    ${isCompleted ? 'Review Course' : 'Continue Learning'}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                    coursesGrid.innerHTML += cardHtml;
                });
            }
        }

        // Initial render
        renderMyCourses();

        // Modal event listeners
        joinClassBtn.addEventListener('click', () => joinClassModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => joinClassModal.classList.add('hidden'));
        cancelModalBtn.addEventListener('click', () => joinClassModal.classList.add('hidden'));

        // Join class logic
        joinClassForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const classCode = document.getElementById('class-code-input').value.trim();
            if (!classCode) {
                alert('Please enter a class code.');
                return;
            }

            const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
            const courseToJoin = allCourses.find(c => c.classCode === classCode && c.status === 'Published');

            if (!courseToJoin) {
                alert('Invalid or inactive class code. Please check the code and try again.');
                return;
            }

            const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];
            const userIndex = allUsers.findIndex(u => u.email === currentUser.email);
            const user = allUsers[userIndex];

            if (!user.enrolledCourses) {
                user.enrolledCourses = [];
            }

            if (user.enrolledCourses.includes(courseToJoin.id)) {
                alert('You are already enrolled in this class.');
                return;
            }

            // Add course to user
            user.enrolledCourses.push(courseToJoin.id);
            allUsers[userIndex] = user;
            localStorage.setItem('acognix_users', JSON.stringify(allUsers));

            // Add enrollment record
            const allEnrollments = JSON.parse(localStorage.getItem('acognix_enrollments')) || [];
            const newEnrollment = {
                id: allEnrollments.length > 0 ? Math.max(...allEnrollments.map(e => e.id)) + 1 : 1,
                courseId: courseToJoin.id,
                studentEmail: currentUser.email,
                status: 'approved', // Auto-approved for simplicity with class code
                enrolledAt: new Date().toISOString()
            };
            allEnrollments.push(newEnrollment);
            localStorage.setItem('acognix_enrollments', JSON.stringify(allEnrollments));

            alert(`Successfully joined "${courseToJoin.name}"!`);
            joinClassModal.classList.add('hidden');
            joinClassForm.reset();
            renderMyCourses(); // Re-render the page to show the new course
        });
    });
  </script>

  <script src="../shared/auth-guard.js"></script>
</body>
</html>
