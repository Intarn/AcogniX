          <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            User Management
          </a>
          <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Community

          <a href="./admin-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">

            Analytics
          </a>

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>

      </div>
      <!-- Footer Profile -->
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop" class="w-9 h-9 rounded-full object-cover">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight">Admin Name</p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400">Administrator</p>
          </div>
          <a href="./login.html" class="ml-auto text-xs font-semibold text-red-500 hover:text-red-700">
            Logout
          </a>
        </div>
      </div>
    </aside>
    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">User Management</h1>
        <div class="flex items-center gap-3">
          <div class="relative w-72">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input id="search-input" type="text" placeholder="Search by name or email..." class="w-full bg-gray-50/80 text-xs rounded-lg pl-9 pr-4 py-2 border border-gray-200 outline-none focus:bg-white focus:border-blue-300">
          </div>
          <select id="role-filter" class="text-xs border border-gray-200 rounded-lg px-3 py-2 bg-white outline-none focus:ring-1 focus:ring-blue-300">
            <option value="all">All Roles</option>
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
          <a href="./admin-add-user.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
            + Add New User
          </a>
        </div>
      </header>
      <!-- 3. USER MANAGEMENT CONTENT -->
      <main class="p-6">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-500 uppercase bg-gray-50/50">
              <tr>
                <th class="px-6 py-3">Name</th>
                <th class="px-6 py-3">Email</th>
                <th class="px-6 py-3">Role</th>
                <th class="px-6 py-3">Last Active</th>
                <th class="px-6 py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="user-management-table" class="divide-y divide-gray-100">
              <!-- Dữ liệu sẽ được chèn vào đây bằng JavaScript -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const tableBody = document.getElementById('user-management-table');
        const searchInput = document.getElementById('search-input');
        const roleFilter = document.getElementById('role-filter');
        const USERS_KEY = 'acognix_users';

        // Cập nhật thông tin admin đang đăng nhập
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (currentUser) {
            document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
            document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
            const avatarImg = document.getElementById('user-avatar-sidebar');
            avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;
        } else {
            // window.location.href = './login.html';
        }

        function renderTable() {
            tableBody.innerHTML = ''; // Xóa nội dung cũ
            let allUsers = JSON.parse(localStorage.getItem(USERS_KEY)) || [];

            // Lọc và tìm kiếm
            const searchTerm = searchInput.value.toLowerCase();
            const selectedRole = roleFilter.value;

            const filteredUsers = allUsers.filter(user => {
                const matchesSearch = user.fullname.toLowerCase().includes(searchTerm) || user.email.toLowerCase().includes(searchTerm);
                const matchesRole = selectedRole === 'all' || user.role === selectedRole;
                return matchesSearch && matchesRole;
            });

            if (filteredUsers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No users found matching your criteria.</td></tr>`;
                return;
            }

            filteredUsers.forEach(user => {
                let roleClass, roleText;
                switch(user.role) {
                    case 'admin':
                        roleClass = 'bg-red-100 text-red-700';
                        roleText = 'Admin';
                        break;
                    case 'teacher':
                        roleClass = 'bg-amber-100 text-amber-700';
                        roleText = 'Teacher';
                        break;
                    default:
                        roleClass = 'bg-blue-100 text-blue-700';
                        roleText = 'Student';
                }

                const isAdminAccount = user.email === 'admin@acognix.com';

                const editButton = isAdminAccount
                    ? `<button class="text-xs font-bold text-gray-400 cursor-not-allowed" disabled>Sửa</button>`
                    : `<a href="./admin-edit-user.html?email=${user.email}" class="text-xs font-bold text-blue-600 hover:underline">Sửa</a>`;
                const deleteButton = isAdminAccount 
                    ? `<button class="text-xs font-bold text-gray-400 cursor-not-allowed" disabled>Xóa</button>`
                    : `<button data-email="${user.email}" class="delete-btn text-xs font-bold text-red-500 hover:underline">Xóa</button>`;

                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 font-semibold text-gray-800 flex items-center gap-3">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.fullname)}&color=fff" class="w-8 h-8 rounded-full object-cover">
                            ${user.fullname}
                        </td>
                        <td class="px-6 py-4 text-gray-600">${user.email}</td>
                        <td class="px-6 py-4"><span class="text-xs font-semibold ${roleClass} px-2 py-0.5 rounded-full">${roleText}</span></td>
                        <td class="px-6 py-4 text-gray-500">${user.lastActive || 'Gần đây'}</td>
                        <td class="px-6 py-4 flex gap-3">
                            ${editButton}
                            ${deleteButton}
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            // Thêm sự kiện cho các nút xóa
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const emailToDelete = this.getAttribute('data-email');
                    if (confirm(`Bạn có chắc chắn muốn xóa người dùng ${emailToDelete} không?`)) {
                        let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
                        users = users.filter(user => user.email !== emailToDelete);
                        localStorage.setItem(USERS_KEY, JSON.stringify(users));
                        renderTable(); // Vẽ lại bảng
                    }
                });
            });
        }

        // Gắn sự kiện cho thanh tìm kiếm và bộ lọc
        searchInput.addEventListener('input', renderTable);
        roleFilter.addEventListener('change', renderTable);

        renderTable();
    });
  </script>
</body>
</html>
