              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>

            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
        </div>
        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1.5">
          <a href="./admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
          </a>
          <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            User Management
          </a>
          <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            Course Management
          </a>
          <a href="./admin-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Analytics
          </a>
          <a href="./admin-settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            System Settings
          </a>
        </nav>
      </div>
      <!-- Footer Profile -->
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop" class="w-9 h-9 rounded-full object-cover">
          <div class="text-left">
            <p class="text-xs font-bold text-gray-800 leading-tight">Admin User</p>
            <p class="text-[10px] text-gray-400">Administrator</p>
          </div>
        </div>
      </div>
    </aside>
    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      <!-- TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">Edit User</h1>
        <div class="flex items-center gap-3">
          <a href="./admin-user-management.html" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">Cancel</a>
          <button id="save-user-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
            Save Changes
          </button>
        </div>
      </header>
      <!-- EDIT USER FORM -->
      <main class="p-6">
        <div class="w-full max-w-4xl mx-auto bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
          <h3 class="text-base font-bold text-gray-800 mb-6">User Information</h3>
          <form id="edit-user-form" class="space-y-4">
              <div>
                <label for="fullname" class="text-sm font-semibold text-gray-700">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g., John Doe" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
              </div>
              <div>
                <label for="email" class="text-sm font-semibold text-gray-700">Email Address</label>
                <input type="email" id="email" class="mt-1 w-full text-sm text-gray-500 bg-gray-100 rounded-lg px-3 py-2.5 outline-none border border-gray-200" readonly>
                 <p class="text-xs text-gray-400 mt-1">Email không thể thay đổi.</p>
              </div>
              <div>
                <label for="password" class="text-sm font-semibold text-gray-700">Mật khẩu mới (tùy chọn)</label>
                <input type="password" id="password" placeholder="Để trống để giữ mật khẩu cũ" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
              </div>
              <div>
                <label for="role" class="text-sm font-semibold text-gray-700">Vai trò</label>
                <select id="role" class="mt-1 w-full text-sm text-gray-700 rounded-lg px-3 py-2.5 outline-none focus:ring-1 focus:ring-blue-300 border border-gray-200">
                  <option value="student">Student</option>
                  <option value="teacher">Teacher</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const USERS_KEY = 'acognix_users';
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');

        if (!userEmail) {
            alert('Không có người dùng nào được chỉ định!');
            window.location.href = './admin-user-management.html';
            return;
        }

        const fullnameInput = document.getElementById('fullname');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roleInput = document.getElementById('role');
        const saveBtn = document.getElementById('save-user-btn');

        const allUsers = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        const userToEdit = allUsers.find(u => u.email === userEmail);

        if (!userToEdit) {
            alert('Không tìm thấy người dùng!');
            window.location.href = './admin-user-management.html';
            return;
        }

        // Điền thông tin vào form
        fullnameInput.value = userToEdit.fullname;
        emailInput.value = userToEdit.email;
        roleInput.value = userToEdit.role;

        // Không cho phép thay đổi vai trò của admin
        if (userToEdit.role === 'admin') {
            roleInput.disabled = true;
        }

        // Logic lưu
        saveBtn.addEventListener('click', function() {
            const newFullname = fullnameInput.value;
            const newPassword = passwordInput.value;
            const newRole = roleInput.value;

            if (!newFullname) {
                alert('Họ và tên không được để trống.');
                return;
            }

            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            const userIndex = users.findIndex(u => u.email === userEmail);

            if (userIndex > -1) {
                users[userIndex].fullname = newFullname;
                users[userIndex].role = newRole;
                if (newPassword) {
                    users[userIndex].pass = newPassword;
                }
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                alert('Cập nhật người dùng thành công!');
                window.location.href = './admin-user-management.html';
            } else {
                alert('Lỗi: Không tìm thấy người dùng để cập nhật.');
            }
        });
    });
  </script>
</body>
</html>
