      <div>

          <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
        </div>
        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1.5">
          <a href="./teacher-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
          <a href="./teacher-my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>My Courses</a>
          <a href="./teacher-assignments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>Assignments</a>
          <a href="./teacher-students.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Students</a>
          <a href="./teacher-student-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>Analytics</a>
          <a href="./teacher-gradebook.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H4a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>Gradebook</a>
          <a href="./community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Community</a>
        </nav>
      </div>
      <!-- Footer Profile -->
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="" class="w-9 h-9 rounded-full object-cover bg-gray-200">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight"></p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400"></p>
          </div>
          <a href="./settings.html" class="ml-auto"><span class="text-gray-400 text-[10px]">⚙️</span></a>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">My Courses</h1>
        <a href="./teacher-course-builder.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
          + Create New Course
        </a>
      </header>

      <!-- 3. MY COURSES CONTENT -->
      <main class="flex-1 p-6 overflow-y-auto">
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <!-- Course cards will be dynamically inserted here -->
        </div>
      </main>

    </div>
  </div>

  <script>
    const escapeHTML = (str) => {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    };

    document.addEventListener('DOMContentLoaded', function() {
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'teacher') {
            // window.location.href = './login.html';
            return;
        }

        // Update user info in sidebar
        document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
        document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
        document.getElementById('user-avatar-sidebar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;

        const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
        const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];
        const coursesGrid = document.getElementById('courses-grid');

        const myCourses = allCourses.filter(course => course.teacher === currentUser.fullname);

        coursesGrid.innerHTML = '';
        if (myCourses.length === 0) {
            coursesGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">You have not created any courses yet. <a href="./teacher-course-builder.html" class="text-blue-600 font-semibold">Create one now</a>.</p>`;
        } else {
            myCourses.forEach(course => {
                const enrolledCount = allUsers.filter(u => u.role === 'student' && u.enrolledCourses && u.enrolledCourses.includes(course.id)).length;
                const statusColor = course.status === 'Published' ? 'text-green-600 bg-green-100' : 'text-gray-600 bg-gray-100';

                const safeCourseName = escapeHTML(course.name);
                const safeCategory = escapeHTML(course.category || 'N/A');
                const safeStatus = escapeHTML(course.status || 'Draft');

                const cardHtml = `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col">
                        <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&auto=format&fit=crop&q=80&ixid=${course.id}" class="h-32 w-full object-cover">
                        <div class="p-4 flex flex-col flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="text-sm font-bold text-gray-800 mb-1" title="${safeCourseName}">${safeCourseName}</h3>
                                <span class="text-[10px] font-semibold ${statusColor} px-2 py-0.5 rounded-full flex-shrink-0">${safeStatus}</span>
                            </div>
                            <p class="text-[11px] text-gray-400 mb-3">Category: ${safeCategory}</p>
                            
                            <div class="mt-auto space-y-3">
                                <div class="text-xs font-semibold text-gray-600">${enrolledCount} Students Enrolled</div>
                                <div class="flex gap-2">
                                    <a href="./teacher-course-builder.html?id=${course.id}" class="flex-1 text-center bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-xs py-2 rounded-lg transition-colors">
                                        Edit
                                    </a>
                                    <a href="./teacher-class-detail.html?id=${course.id}" class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-xs py-2 rounded-lg transition-colors">
                                        View Details
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                coursesGrid.innerHTML += cardHtml;
            });
        }
    });
  </script>

</body>
</html>
