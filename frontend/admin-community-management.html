        <!-- Navigation -->

            Dashboard
          </a>
          <a href="./admin-user-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            User Management

          <a href="./admin-course-management.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            Course Management

            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>

            Analytics
          </a>
          <a href="./admin-settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">

      </div>
      <!-- Footer Profile -->
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop" class="w-9 h-9 rounded-full object-cover">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight">Admin Name</p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400">Administrator</p>
          </div>
        </div>
      </div>
    </aside>
    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
      <!-- TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">Community Management</h1>
        <div class="relative w-72">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" placeholder="Search by content or author..." class="w-full bg-gray-50/80 text-xs rounded-lg pl-9 pr-4 py-2 border border-gray-200 outline-none focus:bg-white focus:border-blue-300">
        </div>
      </header>
      <!-- CONTENT -->
      <main class="p-6">
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-500 uppercase bg-gray-50/50">
              <tr>
                <th class="px-6 py-3">Post Content</th>
                <th class="px-6 py-3">Author</th>
                <th class="px-6 py-3">Date</th>
                <th class="px-6 py-3">Likes</th>
                <th class="px-6 py-3">Actions</th>
              </tr>
            </thead>
            <tbody id="community-table" class="divide-y divide-gray-100">
              <!-- Data will be inserted here by JavaScript -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const POSTS_KEY = 'acognix_posts';
        const tableBody = document.getElementById('community-table');

        // Cập nhật thông tin admin đang đăng nhập
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (currentUser) {
            document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
            document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
            const avatarImg = document.getElementById('user-avatar-sidebar');
            avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;
        } else {
            // window.location.href = './login.html';
        }

        function renderTable() {
            const posts = JSON.parse(localStorage.getItem(POSTS_KEY)) || [];
            tableBody.innerHTML = '';

            if (posts.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No community posts found.</td></tr>`;
                return;
            }

            posts.forEach(post => {
                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <p class="font-semibold text-gray-800">${post.title}</p>
                            <p class="text-xs text-gray-500 truncate w-96">${post.content}</p>
                        </td>
                        <td class="px-6 py-4 text-gray-600">${post.authorName}</td>
                        <td class="px-6 py-4 text-gray-500">${post.timestamp}</td>
                        <td class="px-6 py-4 text-gray-500 font-semibold">${post.likes}</td>
                        <td class="px-6 py-4">
                            <button data-id="${post.id}" class="delete-btn text-xs font-bold text-red-500 hover:underline">Delete</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            // Add event listeners for delete buttons
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const postId = parseInt(this.getAttribute('data-id'));
                    if (confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
                        let currentPosts = JSON.parse(localStorage.getItem(POSTS_KEY)) || [];
                        currentPosts = currentPosts.filter(p => p.id !== postId);
                        localStorage.setItem(POSTS_KEY, JSON.stringify(currentPosts));
                        renderTable();
                    }
                });
            });
        }

        renderTable();
    });
  </script>
</body>
</html>
