              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF" /><stop offset="50%" stop-color="#3B82F6" /><stop offset="100%" stop-color="#6B21FF" /></linearGradient>

            <path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
        </div>

        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1.5">
          <a href="./teacher-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
          </a>
          <a href="./teacher-my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            My Courses
          </a>
          <a href="./teacher-assignments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            Assignments
          </a>
          <a href="./teacher-students.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Students
          </a>
          <a href="./teacher-student-analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Analytics
          </a>
          <a href="./teacher-gradebook.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H4a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            Gradebook
          </a>
          <a href="./community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Community
          </a>
        </nav>
      </div>
      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 cursor-pointer">
          <img id="user-avatar-sidebar" src="" class="w-9 h-9 rounded-full object-cover bg-gray-200">
          <div class="text-left">
            <p id="user-fullname-sidebar" class="text-xs font-bold text-gray-800 leading-tight"></p>
            <p id="user-role-sidebar" class="text-[10px] text-gray-400"></p>
          </div>
          <a href="./settings.html" class="ml-auto">
            <span class="text-gray-400 text-[10px]">⚙️</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <div class="flex items-center gap-4">
          <h1 class="text-lg font-bold text-gray-800">Gradebook</h1>
          <select id="course-select" class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white outline-none focus:ring-1 focus:ring-blue-300">
            <!-- Courses will be populated here -->
          </select>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative w-64">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input id="search-input" type="text" placeholder="Search student..." class="w-full bg-gray-50/80 text-xs rounded-lg pl-9 pr-4 py-2 border border-gray-200 outline-none focus:bg-white focus:border-blue-300">
          </div>
          <button id="export-btn" class="text-xs font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100">
            Export
          </button>
        </div>
      </header>

      <!-- 3. GRADEBOOK CONTENT -->
      <main class="flex-1 overflow-auto">
        <div class="p-6">
          <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-x-auto">
            <table id="gradebook-table" class="w-full text-sm">
              <thead id="gradebook-head" class="text-xs text-gray-500 uppercase bg-gray-50/50 sticky top-0">
                <!-- Header will be generated by JS -->
              </thead>
              <tbody id="gradebook-body" class="divide-y divide-gray-100">
                <!-- Body will be generated by JS -->
              </tbody>
              <tfoot id="gradebook-foot" class="text-xs text-gray-500 uppercase bg-gray-50/50 sticky bottom-0">
                <!-- Footer will be generated by JS -->
              </tfoot>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'teacher') {
            // window.location.href = './login.html';
            return;
        }

        // Update user info in sidebar
        document.getElementById('user-fullname-sidebar').textContent = currentUser.fullname;
        document.getElementById('user-role-sidebar').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
        document.getElementById('user-avatar-sidebar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;

        const courseSelect = document.getElementById('course-select');
        const searchInput = document.getElementById('search-input');
        const tableHead = document.getElementById('gradebook-head');
        const tableBody = document.getElementById('gradebook-body');
        const tableFoot = document.getElementById('gradebook-foot');

        const allCourses = JSON.parse(localStorage.getItem('acognix_courses')) || [];
        const allUsers = JSON.parse(localStorage.getItem('acognix_users')) || [];
        const allAssignments = JSON.parse(localStorage.getItem('acognix_assignments')) || [];

        // 1. Populate course dropdown
        const myCourses = allCourses.filter(c => c.teacher === currentUser.fullname);
        courseSelect.innerHTML = myCourses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        // 2. Function to render the gradebook for a selected course
        function renderGradebook() {
            const courseId = parseInt(courseSelect.value);
            const searchTerm = searchInput.value.toLowerCase();

            const course = myCourses.find(c => c.id === courseId);
            if (!course) return;

            const studentsInCourse = allUsers.filter(u => u.role === 'student' && u.enrolledCourses && u.enrolledCourses.includes(courseId) && u.fullname.toLowerCase().includes(searchTerm));
            const assignmentsForCourse = allAssignments.filter(a => a.courseId === courseId);

            // Build Header
            let headerHtml = '<tr><th class="px-4 py-3 font-bold text-left whitespace-nowrap">Student Name</th>';
            assignmentsForCourse.forEach(a => {
                headerHtml += `<th class="px-4 py-3 text-center whitespace-nowrap">${a.title}<span class="block font-normal text-[10px]">/ 100</span></th>`;
            });
            headerHtml += '<th class="px-4 py-3 font-bold text-center whitespace-nowrap bg-gray-100/80">Average</th></tr>';
            tableHead.innerHTML = headerHtml;

            // Build Body
            let bodyHtml = '';
            if (studentsInCourse.length === 0) {
                const colspan = assignmentsForCourse.length + 2;
                bodyHtml = `<tr><td colspan="${colspan}" class="text-center p-4 text-gray-500">No students in this course.</td></tr>`;
            } else {
                studentsInCourse.forEach(student => {
                    bodyHtml += `<tr><td class="px-4 py-2 font-semibold text-gray-700 whitespace-nowrap">${student.fullname}</td>`;
                    let totalScore = 0;
                    assignmentsForCourse.forEach(() => {
                        const score = Math.floor(Math.random() * 40) + 60; // Mock score 60-99
                        totalScore += score;
                        bodyHtml += `<td class="px-4 py-2 text-center"><input type="text" value="${score}" class="w-12 text-center bg-gray-50 rounded-md outline-none focus:ring-1 focus:ring-blue-400"></td>`;
                    });
                    const average = assignmentsForCourse.length > 0 ? (totalScore / assignmentsForCourse.length).toFixed(1) : 'N/A';
                    bodyHtml += `<td class="px-4 py-2 font-bold text-center bg-gray-50/80 text-blue-600">${average}%</td></tr>`;
                });
            }
            tableBody.innerHTML = bodyHtml;

            // Build Footer (optional, can be complex)
            tableFoot.innerHTML = ''; // Clear footer for now
        }

        // 3. Initial render and event listener
        if (myCourses.length > 0) {
            renderGradebook();
        } else {
            tableBody.innerHTML = '<tr><td class="p-4 text-center text-gray-500">You have no courses to display.</td></tr>';
        }

        courseSelect.addEventListener('change', renderGradebook);
        searchInput.addEventListener('input', renderGradebook);
        document.getElementById('export-btn').addEventListener('click', () => alert('Chức năng Export đang được phát triển!'));
    });
  </script>

</body>
</html>
