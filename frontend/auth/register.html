<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <div class="flex min-h-screen items-center justify-center p-4">
    
    <div class="w-full max-w-md">
      <!-- Logo và Tiêu đề -->
      <div class="mb-8 text-center">
        <div class="flex items-center justify-center gap-2.5 mb-4">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8B3DFF" />
                <stop offset="100%" stop-color="#6B21FF" />
              </linearGradient>
              <linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00A3FF" />
                <stop offset="100%" stop-color="#3B82F6" />
              </linearGradient>
              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00C2FF" />
                <stop offset="50%" stop-color="#3B82F6" />
                <stop offset="100%" stop-color="#6B21FF" />
              </linearGradient>
            </defs>
            <path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-3xl font-black text-slate-900 tracking-tight">AcogniX</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create Your Account</h1>
        <p class="text-sm text-gray-500 mt-1">Join AcogniX to start your AI-powered learning journey.</p>
      </div>

      <!-- Form Đăng ký -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <form id="register-form" class="space-y-5">
          <!-- Tên đầy đủ -->
          <div>
            <label for="fullname" class="text-sm font-semibold text-gray-700">Full Name</label>
            <input 
              type="text" 
              id="fullname" 
              name="fullname"
              placeholder="An Nguyen"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="text-sm font-semibold text-gray-700">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="you@example.com"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
          </div>

          <!-- Mật khẩu -->
          <div>
            <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
          </div>

          <!-- Role -->
          <div>
            <label for="role" class="text-sm font-semibold text-gray-700">I am a...</label>
            <select 
              id="role" 
              name="role"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
            </select>
          </div>

          <!-- Nút Đăng ký -->
          <button id="submit-btn" type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm shadow-md hover:shadow-lg transition-all">
            Create Account
          </button>
        </form>
      </div>

      <!-- Link Đăng nhập -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account? <a href="./login.html" class="font-semibold text-blue-600 hover:underline">Log in</a>
      </p>
    </div>

  </div>

  <script>
    // Cấu hình Base URL Backend
    const API_BASE_URL = 'http://localhost:3001/api/auth';

    document.getElementById('register-form').addEventListener('submit', async function(event) {
      event.preventDefault();

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const selectedRole = document.getElementById('role').value;
      const submitBtn = document.getElementById('submit-btn');

      // 1. Ánh xạ Role từ Giao diện sang Enum của Backend (LEARNER / EDUCATOR)
      const roleMap = {
        'Student': 'LEARNER',
        'Teacher': 'EDUCATOR'
      };
      const role = roleMap[selectedRole] || selectedRole;

      // 2. Vô hiệu hóa nút bấm tránh spam request
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

      try {
        // 3. Gửi Request đăng ký tới endpoint POST /signup
        const response = await fetch(`${API_BASE_URL}/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password,
            displayName: fullname, // Map 'fullname' sang 'displayName' theo yêu cầu AuthController
            role: role
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert(data.message || 'Your account has been created successfully.');
          // Chuyển hướng sang trang Đăng nhập
          window.location.href = './login.html';
        } else {
          // Hiển thị thông báo lỗi trực tiếp từ Backend (Ví dụ: Email đã tồn tại, định dạng không đúng,...)
          alert(data.message || 'Failed to create account.');
        }
      } catch (error) {
        console.error('Error connecting to backend:', error);
        alert('Cannot connect to the server. Please check your backend connection.');
      } finally {
        // Mở lại nút bấm
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    });
  </script>

</body>
</html>
