<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <div class="flex min-h-screen items-center justify-center p-4">
    
    <div class="w-full max-w-md">
      <!-- Logo và Tiêu đề -->
      <div class="mb-8 text-center">
        <div class="flex items-center justify-center gap-2.5 mb-4">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8B3DFF" />
                <stop offset="100%" stop-color="#6B21FF" />
              </linearGradient>
              <linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00A3FF" />
                <stop offset="100%" stop-color="#3B82F6" />
              </linearGradient>
              <linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00C2FF" />
                <stop offset="50%" stop-color="#3B82F6" />
                <stop offset="100%" stop-color="#6B21FF" />
              </linearGradient>
            </defs>
            <path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round" />
            <path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)" />
          </svg>
          <span class="text-3xl font-black text-slate-900 tracking-tight">AcogniX</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back!</h1>
        <p class="text-sm text-gray-500 mt-1">Log in to continue your AI-powered learning journey.</p>
      </div>

      <!-- Form Đăng nhập -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <form id="login-form" class="space-y-5">
          <!-- Email -->
          <div>
            <label for="email" class="text-sm font-semibold text-gray-700">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="you@example.com"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
          </div>

          <!-- Mật khẩu -->
          <div>
            <div class="flex justify-between items-center">
              <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
              <a href="#" class="text-xs font-semibold text-blue-600 hover:underline">Forgot password?</a>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••"
              class="mt-1 w-full bg-gray-50 text-sm text-gray-700 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-200 transition-all border border-gray-200 focus:border-blue-400"
              required
            >
          </div>

          <!-- Nút Đăng nhập -->
          <button id="submit-btn" type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
            <span>Log In</span>
          </button>
        </form>
      </div>

      <!-- Link Đăng ký -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account? <a href="./register.html" class="font-semibold text-blue-600 hover:underline">Sign up</a>
      </p>
    </div>

  </div>

  <script>
    // Cấu hình URL endpoint Backend
    // Thay đổi PORT hoặc đường dẫn nếu server của bạn sử dụng prefix khác (ví dụ: http://localhost:5000/api/auth)
    const API_BASE_URL = 'http://localhost:3001/api/auth';

    document.getElementById('login-form').addEventListener('submit', async function(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      // Vô hiệu hóa nút bấm trong khi chờ request
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

      try {
        const response = await fetch(`${API_BASE_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // 1. Lưu JWT token vào localStorage
          localStorage.setItem('accessToken', data.token);

          // 2. Ánh xạ (Map) URL từ Backend sang vị trí file HTML vật lý trên máy
          const routeMap = {
            '/learner-dashboard': '../student/dashboard.html',
            '/educator-dashboard': '../teacher/teacher-dashboard.html',
            '/admin-portal': '../admin/admin-dashboard.html'
          };

          // 3. Chuyển hướng. Nếu Backend trả về URL có trong danh sách trên, nó sẽ tới đúng file.
          const targetUrl = routeMap[data.redirectTo];
          
          if (targetUrl) {
            window.location.href = targetUrl;
          } else {
            // Đề phòng trường hợp Backend trả về URL lạ
            alert("Đăng nhập thành công nhưng không tìm thấy trang đích!");
            window.location.href = '../index.html'; 
          }
        }
      } catch (error) {
        console.error('Error connecting to backend:', error);
        alert('Cannot connect to the server. Please check your backend connections.');
      } finally {
        // Mở lại nút bấm
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    });
  </script>

</body>
</html>
