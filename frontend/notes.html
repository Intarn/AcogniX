<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - AcogniX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden text-gray-800">

  <div class="flex h-full w-full">
    
    <!-- 1. SIDEBAR -->
    <aside id="sidebar-container" class="w-60 h-full bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0">
      <!-- Sidebar content will be injected here -->
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 2. TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
        <h1 class="text-lg font-bold text-gray-800">My Notes</h1>
        <div class="flex items-center gap-3">
          <button id="new-note-btn-topbar" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors">
            + New Note
          </button>
          <div id="user-profile-topbar" class="flex items-center gap-3 cursor-pointer ml-2">
            <img id="user-avatar-topbar" src="" class="w-8 h-8 rounded-full object-cover bg-gray-200">
            <div class="text-left">
              <p id="user-greeting-topbar" class="text-xs font-bold text-gray-800 leading-tight">Hi, User</p>
              <p id="user-role-topbar" class="text-[10px] text-gray-400">Role</p>
            </div>
          </div>
        </div>
      </header>

      <!-- 3. NOTES CONTENT -->
      <main class="flex-1 flex overflow-hidden">

        <!-- 3.1. LEFT: NOTES LIST -->
        <div class="w-80 h-full bg-white border-r border-gray-100 flex flex-col flex-shrink-0">
          <div class="p-4 border-b border-gray-100 flex-shrink-0">
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <!-- Thêm ID cho thanh Search -->
              <input type="text" id="search-notes-input" placeholder="Search notes..." class="w-full bg-gray-50/80 text-xs rounded-lg pl-9 pr-4 py-2 border border-gray-200 outline-none focus:bg-white focus:border-blue-300 transition-colors">
            </div>
          </div>
          <div id="notes-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Notes will be dynamically loaded here -->
          </div>
        </div>

        <!-- 3.2. RIGHT: NOTE EDITOR -->
        <div class="flex-1 h-full flex flex-col">
          <!-- Editor Toolbar -->
          <div id="editor-toolbar" class="flex-shrink-0 h-14 bg-white border-b border-gray-100 flex items-center justify-between px-5">
            <div class="flex items-center gap-3">
              <div class="w-px h-5 bg-gray-200"></div>
              <!-- Thêm ID để kích hoạt chức năng Rich Text -->
              <button id="btn-bold" class="p-2 rounded-md hover:bg-gray-100 text-gray-700 font-bold text-sm transition-colors" title="Bold">B</button>
              <button id="btn-italic" class="p-2 rounded-md hover:bg-gray-100 text-gray-700 italic text-sm transition-colors" title="Italic">I</button>
              <button id="btn-underline" class="p-2 rounded-md hover:bg-gray-100 text-gray-700 underline text-sm transition-colors" title="Underline">U</button>
              <div class="w-px h-5 bg-gray-200"></div>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400">
              <span id="save-status"></span>
            </div>
          </div>
          <!-- Editor Content -->
          <div id="note-editor-area" class="flex-1 overflow-y-auto p-8">
            <input type="text" id="note-title" class="w-full text-2xl font-bold text-gray-800 outline-none mb-6 bg-transparent" placeholder="Note Title">
            <div id="note-content" class="text-base text-gray-700 leading-relaxed space-y-4 outline-none min-h-[300px]" contenteditable="true" placeholder="Start writing your note here...">
              <p>Start writing your note here...</p>
            </div>
            <div class="mt-8 flex justify-end gap-3 border-t border-gray-100 pt-4">
              <!-- Thêm nút Delete -->
              <button id="delete-note-btn" class="text-red-600 bg-red-50 hover:bg-red-100 text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors hidden">Delete Note</button>
              <button id="save-note-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-6 py-2 rounded-lg shadow-sm transition-colors">Save Note</button>
            </div>
          </div>
        </div>

      </main>

    </div>
  </div>

  <script>
    // Tiện ích chống XSS
    const escapeHTML = (str) => {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    };

    // BỌC TOÀN BỘ LOGIC VÀO TRONG DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
        const NOTES_KEY = 'acognix_notes';
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));

        if (!currentUser) {
            // Uncomment in production: window.location.href = './login.html';
            return;
        }

        // --- HỆ THỐNG SIDEBAR ĐỘNG ---
        const sidebarContainer = document.getElementById('sidebar-container');
        const userAvatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.fullname)}&color=fff&size=36`;
        const safeFullname = escapeHTML(currentUser.fullname);
        const role = currentUser.role || 'student';

        const studentSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF"></stop><stop offset="100%" stop-color="#3B82F6"></stop></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF"></stop><stop offset="50%" stop-color="#3B82F6"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round"></path><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)"></path></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Home</a>
                    <a href="./ai-workspace.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>AI Workspace</a>
                    <a href="./my-courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>My Courses</a>
                    <a href="./flashcards.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>Flashcards</a>
                    <a href="./quizzes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Quizzes</a>
                    <a href="./notes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Notes</a>
                    <a href="./community.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.653-.124-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.653.124-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>Community</a>
                    <a href="./progress.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>Progress</a>
                    <a href="./settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Settings</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <button class="w-full py-2.5 bg-amber-100/60 hover:bg-amber-100 text-amber-700 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-colors">⭐ Upgrade to Pro</button>
            </div>
        `;

        const teacherSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF"></stop><stop offset="100%" stop-color="#3B82F6"></stop></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF"></stop><stop offset="50%" stop-color="#3B82F6"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round"></path><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)"></path></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./teacher-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Dashboard</a>
                    <a href="./notes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Notes</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p class="text-xs font-bold text-gray-800 leading-tight">${safeFullname}</p>
                        <p class="text-[10px] text-gray-400">Teacher</p>
                    </div>
                </div>
            </div>
        `;

        const adminSidebarTemplate = `
            <div>
                <div class="p-6 flex items-center gap-2.5">
                    <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad-leg" x1="50" y1="15" x2="80" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8B3DFF"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient><linearGradient id="grad-left" x1="20" y1="85" x2="35" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00A3FF"></stop><stop offset="100%" stop-color="#3B82F6"></stop></linearGradient><linearGradient id="grad-swoosh" x1="25" y1="70" x2="95" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C2FF"></stop><stop offset="50%" stop-color="#3B82F6"></stop><stop offset="100%" stop-color="#6B21FF"></stop></linearGradient></defs><path d="M 33 55 L 46 25 C 47.5 21.5 52.5 21.5 54 25 L 76 76" stroke="url(#grad-leg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 22 80 L 26 70" stroke="url(#grad-left)" stroke-width="14" stroke-linecap="round"></path><path d="M 26 65 C 50 78 70 70 92 48 C 65 68 45 74 24 73 Z" fill="url(#grad-swoosh)"></path></svg>
                    <span class="text-2xl font-black text-slate-900 tracking-tight font-sans">AcogniX</span>
                </div>
                <nav class="px-3 flex flex-col gap-1.5">
                    <a href="./admin-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>Dashboard</a>
                    <a href="./notes.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Notes</a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <img src="${userAvatarUrl}" class="w-9 h-9 rounded-full object-cover">
                    <div class="text-left flex-1">
                        <p class="text-xs font-bold text-gray-800 leading-tight">${safeFullname}</p>
                        <p class="text-[10px] text-gray-400">Admin</p>
                    </div>
                </div>
            </div>
        `;

        if (role === 'teacher') sidebarContainer.innerHTML = teacherSidebarTemplate;
        else if (role === 'admin') sidebarContainer.innerHTML = adminSidebarTemplate;
        else sidebarContainer.innerHTML = studentSidebarTemplate;

        // --- Topbar Setup ---
        document.getElementById('user-greeting-topbar').textContent = `Hi, ${safeFullname}`;
        document.getElementById('user-role-topbar').textContent = role.charAt(0).toUpperCase() + role.slice(1);
        document.getElementById('user-avatar-topbar').src = userAvatarUrl;

        // --- Core Application Logic ---
        const notesListContainer = document.getElementById('notes-list');
        const noteTitleInput = document.getElementById('note-title');
        const noteContentDiv = document.getElementById('note-content');
        const saveNoteBtn = document.getElementById('save-note-btn');
        const deleteNoteBtn = document.getElementById('delete-note-btn');
        const newNoteBtn = document.getElementById('new-note-btn-topbar');
        const searchInput = document.getElementById('search-notes-input');
        const saveStatusEl = document.getElementById('save-status');

        let activeNoteId = null;

        function renderNotesList() {
            const allNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
            let userNotes = allNotes.filter(note => note.userId === currentUser.email);
            
            // Xử lý Tìm kiếm
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (searchTerm) {
                userNotes = userNotes.filter(note => 
                    (note.title && note.title.toLowerCase().includes(searchTerm)) || 
                    (note.content && note.content.toLowerCase().includes(searchTerm))
                );
            }

            notesListContainer.innerHTML = '';

            if (userNotes.length === 0) {
                notesListContainer.innerHTML = `<p class="text-center text-gray-500 py-4 text-xs">${searchTerm ? 'No notes match your search.' : 'No notes yet. Click "New Note" to create one.'}</p>`;
                return;
            }

            userNotes.sort((a, b) => new Date(b.date) - new Date(a.date));

            userNotes.forEach(note => {
                const isActive = note.id === activeNoteId;
                
                // Trích xuất văn bản thuần từ nội dung HTML để làm preview (Tránh XSS và lỗi layout)
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.content || '';
                const plainTextSnippet = escapeHTML(tempDiv.textContent || tempDiv.innerText || '').substring(0, 50);
                const safeTitle = escapeHTML(note.title || 'Untitled Note');

                const noteElement = document.createElement('div');
                noteElement.classList.add('p-3', 'rounded-lg', 'cursor-pointer', 'transition-colors', 'border', 'border-transparent');
                
                if (isActive) {
                    noteElement.classList.add('bg-blue-50', '!border-blue-200');
                } else {
                    noteElement.classList.add('hover:bg-gray-50');
                }
                
                noteElement.innerHTML = `
                    <h3 class="text-sm font-bold ${isActive ? 'text-blue-800' : 'text-gray-800'} truncate" title="${safeTitle}">${safeTitle}</h3>
                    <p class="text-xs text-gray-500 mt-1 truncate">${plainTextSnippet}...</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-[10px] font-medium text-gray-400">${note.date}</span>
                    </div>
                `;
                noteElement.addEventListener('click', () => loadNote(note.id));
                notesListContainer.appendChild(noteElement);
            });
        }

        function loadNote(id) {
            const allNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
            const note = allNotes.find(n => n.id === id && n.userId === currentUser.email);
            if (note) {
                activeNoteId = note.id;
                noteTitleInput.value = note.title;
                noteContentDiv.innerHTML = note.content;
                deleteNoteBtn.classList.remove('hidden'); // Hiện nút Delete khi đang xem một note cũ
                saveStatusEl.textContent = '';
                renderNotesList(); 
            }
        }

        function createNewNote() {
            activeNoteId = null;
            noteTitleInput.value = '';
            noteContentDiv.innerHTML = '<p><br></p>'; // Xóa nội dung
            noteContentDiv.focus();
            deleteNoteBtn.classList.add('hidden'); // Ẩn nút Delete khi tạo note mới
            saveStatusEl.textContent = '';
            renderNotesList();
        }

        function saveNote() {
            const title = noteTitleInput.value.trim();
            const content = noteContentDiv.innerHTML.trim();
            
            // Lấy thời gian thực
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            if (!title && (!content || content === '<p><br></p>')) {
                alert('Cannot save an empty note!');
                return;
            }

            let allNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];

            if (activeNoteId) {
                const noteIndex = allNotes.findIndex(n => n.id === activeNoteId && n.userId === currentUser.email);
                if (noteIndex > -1) {
                    allNotes[noteIndex].title = title;
                    allNotes[noteIndex].content = content;
                    allNotes[noteIndex].date = dateStr;
                }
            } else {
                const newId = allNotes.length > 0 ? Math.max(...allNotes.map(n => n.id)) + 1 : 1;
                const newNote = { 
                    id: newId, 
                    userId: currentUser.email, 
                    title: title, 
                    content: content, 
                    date: dateStr
                };
                allNotes.push(newNote);
                activeNoteId = newId; 
                deleteNoteBtn.classList.remove('hidden'); // Lưu xong thì được xóa
            }
            
            localStorage.setItem(NOTES_KEY, JSON.stringify(allNotes));
            saveStatusEl.textContent = `Saved at ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
            renderNotesList();
        }

        function deleteNote() {
            if (!activeNoteId) return;
            if (confirm("Are you sure you want to delete this note? This action cannot be undone.")) {
                let allNotes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
                allNotes = allNotes.filter(n => n.id !== activeNoteId);
                localStorage.setItem(NOTES_KEY, JSON.stringify(allNotes));
                
                createNewNote(); // Xóa xong quay về trang thái viết Note mới
            }
        }

        // --- Event Listeners ---
        newNoteBtn.addEventListener('click', createNewNote);
        saveNoteBtn.addEventListener('click', saveNote);
        deleteNoteBtn.addEventListener('click', deleteNote);
        searchInput.addEventListener('input', renderNotesList);

        // --- Toolbar Rich Text ---
        document.getElementById('btn-bold').addEventListener('click', () => document.execCommand('bold', false, null));
        document.getElementById('btn-italic').addEventListener('click', () => document.execCommand('italic', false, null));
        document.getElementById('btn-underline').addEventListener('click', () => document.execCommand('underline', false, null));

        // Khởi tạo
        renderNotesList();
        
        // Tự động focus vào note đầu tiên nếu có
        if (notesListContainer.firstElementChild && notesListContainer.firstElementChild.dataset.noteId) {
            loadNote(parseInt(notesListContainer.firstElementChild.dataset.noteId));
        }
    });
  </script>
</body>
</html>
